  if(k==='C') state.answer="";
  else if(k==='DEL') state.answer=state.answer.slice(0,-1);
  else { if(state.answer.length<3) state.answer+=k; }
  // strip leading zeros
  state.answer=state.answer.replace(/^0+(?=\d)/,'');
  renderAnswer();
  // ③ レベル4: 入力した答えで「180 − □ = 答え」を計算メモに表示
  if(state.level===3){
    const known=state.q.known;
    if(state.answer!==''){
      const v=parseInt(state.answer,10);
      setMemo(`180 − ${known} = <span class="eq-result">${v}°</span>`, true);
    }else{
      setMemo(`180 − ${known} = <span class="eq-result">？</span>`, false);
    }
  }
});

/* tapping the answer-display deselects any level-5 "?" part so the keypad types
   back into the main answer box (no need to re-tap the figure "?" to release). */
ansDisplay.addEventListener('click',()=>{
  if(state.level===4 && state.activePart){
    state.activePart=null;
    render();
  }
});

/* ================= SUBMIT / JUDGE ================= */
document.getElementById('submitBtn').addEventListener('click',judge);
function judge(){
  if(state.answer===""){ toast(false,'すうじを いれてね','テンキーで こたえを にゅうりょく'); return; }
  // ① 見積もりレベル: 90度より大きい/小さいで判定（ぴったりの数値は不要）
  if(state.q.level===0){
    // ② 数あてチャレンジ: 角度の数値を予想。誤差で 花丸/◎/○ を判定
    if(state.estChallenge){
      const guess=parseInt(state.answer,10);
      if(isNaN(guess)){ toast(false,'すうじを いれてね','テンキーで よそうを にゅうりょく'); return; }
      const err=Math.abs(guess-state.q.target);
      if(err===0){
        state.score+=3; document.getElementById('score').textContent=state.score;
        toast(true,'🌸 花まる！ ぴったり！！',`せいかいは ${state.q.target}度。まさに 名人わざ！ (+3)`);
        confettiBurst(); confettiBurst();
        setTimeout(nextQuestion,1800);
      }else if(err<=10){
        state.score+=2; document.getElementById('score').textContent=state.score;
        toast(true,`◎ ニアピン！`,`せいかいは ${state.q.target}度（あと ${err}度！）すごい目！ (+2)`);
        confettiBurst();
        setTimeout(nextQuestion,1800);
      }else if(err<=20){
        state.score+=1; document.getElementById('score').textContent=state.score;
        toast(true,`○ おしい！`,`せいかいは ${state.q.target}度（${err}度ずれ）いい かんかく！ (+1)`);
        confettiBurst();
        setTimeout(nextQuestion,1800);
      }else{
        const dir=guess<state.q.target?'もっと 大きいよ':'もっと 小さいよ';
        toast(false,'△ ざんねん！もう一度',`せいかいは ${state.q.target}度。${dir}`);
        state.answer=""; renderAnswer();
      }
      return;
    }
    const correct = state.q.target<90 ? 'small' : 'big';
    if(state.answer===correct){
      state.score++; document.getElementById('score').textContent=state.score;
      toast(true,'せいかい！',pick(['いい目だね！','その通り！','よく見えたね！','かんぺき！']));
      confettiBurst();
      setTimeout(nextQuestion,1400);
    }else{
      toast(false,'おしい！もういちど 見てみよう','90度（まっすぐ立った かど）と くらべてみてね');
      state.answer=""; renderAnswer();
      document.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('picked'));
    }
    return;
  }
  const val=parseInt(state.answer,10);
  if(val===state.q.target){
    state.score++; document.getElementById('score').textContent=state.score;
    toast(true,'せいかい！',pick(['すごい！','やったね！','てんさい！','かんぺき！']));
    confettiBurst();
    setTimeout(nextQuestion,1400);
  }else{
    toast(false,'もういちど 考えてみよう！','「💡ヒント」や「🔍ルーペ」を つかってみよう');
    state.answer=""; renderAnswer();
    // ② 2択モード: 選択をリセットしてもう一度選べるように
    document.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('picked'));
  }
}

/* ================= FLOW ================= */
function startLevel(lv){
  state.level=lv; state.qIndex=0; updatePips();
  newQuestion();
}
function newQuestion(){
  state.q=genQuestion(state.level);
  state.answer=""; state.hint=false; state.loupe=false; state.loupeFocus=null; state.loupePart=null;
  const hb=document.getElementById('hintBtn'); if(hb) hb.classList.remove('chosen');
  state.extended=false; state.mode=null; state.auxAngle=null; state.auxLocked=false; state.auxBase='A';
  state.partInputs={a:"",b:""}; state.activePart=null;
  state.estChallenge=false;
  state.cmp90=false;
  // v24: 新レベル1は「90度大小を選ぶ→分度器で測る」の2フェーズ。最初は選択フェーズ。
  state.measurePhase = (state.level!==1);
  closeCalc();   // ③ hide the calculator when switching question/level
  // protractor reset
  const p=state.prot;
  //   level0(推定)・level3(直線分割) は分度器なし。
  //   level1 は選択フェーズの間は隠し、measurePhase になったら出す。
  p.visible=(state.level!==3 && state.level!==0 &&
             !(state.level===1 && !state.measurePhase));
  const R=protRadius();
  p.x=clamp(state.q.cx, R+8, W-R-8);
  // 分度器の上端が上のウィンドウに重ならないよう、上に余白(約110px)を確保してから配置
  p.y=clamp(Math.max(H*0.46, R+110), R+8, H-8);
  p.rot=0; p.vlock=false; p.elock=false;
  configUIForLevel();
  renderAnswer();
  render();
  setQuestionText();
}
function nextQuestion(){
  state.qIndex++;
  if(state.qIndex>=state.qPerLevel){ finishLevel(); return; }
  newQuestion();
}
function setQuestionText(){
  updateFlow();
}

/* ④ 上のウィンドウ（questionbar）に「作業の流れ」を段階表示する。
   旧 helpnote と「この角の大きさは何度かな？」を統合し、いま何をすべきかを
   step として出す。分度器の状態（出ているか・頂点ロック・辺ロック）から
   現在のステップを判定する。 */
function currentStep(){
  const q=state.q; if(!q) return null;
  const p=state.prot;
  const lv=q.level;
  if(lv===0){
    if(state.estChallenge){
      return {icon:'🎯',main:'この 角は 何度かな？ よそうしてみよう！',
        sub:'すうじを いれて こたえてね（ぴたりで 花まる！）'};
    }
    return {icon:'👀',main:'90度より 大きい？ 小さい？'};
  }
  // ── 新レベル1: 鋭角＋鈍角混合（90度大小を選ぶ→分度器で測る）──
  if(lv===1){
    if(!state.measurePhase){
      return {icon:'👀',main:'まず 90度より 大きい？ 小さい？'};
    }
    if(!p.vlock){
      return {icon:'🎯',main:'分度器を 角の ちょうてんに あわせてね'};
    }
    if(!p.elock){
      return {icon:'📐',main:'分度器の 0度の 線を へんに あわせてね'};
    }
    return {icon:'🔢',main:'目もりを よんで こたえてね'};
  }
  // ── 新レベル2: 辺が短い角（旧 level3）──
  if(lv===2){
    if(!state.extended){
      return {icon:'📏',main:'まず「へんを のばす」を おそう'};
    }
    if(!p.vlock){
      return {icon:'🎯',main:'分度器を 角の ちょうてんに あわせてね'};
    }
    if(!p.elock){
      return {icon:'📐',main:'分度器の 0度の 線を へんに あわせてね'};
    }
    return {icon:'🔢',main:'目もりを よんで こたえてね'};
  }
  // ── 新レベル3: 直線分割（旧 level4）──
  if(lv===3){
    return {icon:'🧮',main:'「？」の 角は なん度かな？（180 − □）'};
  }
  // ── 新レベル4: 180度より大きい角（旧 level5）──
  if(!state.mode){
    return {icon:'🤔',main:'180度より 大きい 角だよ。ほうほうを えらんでね'};
  }
  if(state.mode==='aux'){
    if(!state.auxLocked){
      return {icon:'✏️',main:'点線を まっすぐ(180度)の のばした線に あわせよう'};
    }
    if(!p.vlock){
      return {icon:'🎯',main:'分度器を 角の ちょうてんに あわせてね'};
    }
    return {icon:'🔢',main:'2つの「？」を タップして 入力しよう（180 + □）'};
  }
  if(state.mode==='360'){
    if(!p.vlock){
      return {icon:'🎯',main:'分度器を 角の ちょうてんに あわせてね'};
    }
    return {icon:'🔢',main:'内がわの「？」を タップして 入力しよう（360 − □）'};
  }
  return null;
}
let _lastStepMain='';
function updateFlow(flash){
  const q=state.q; if(!q) return;
  document.getElementById('qnum').textContent=`${state.qIndex+1}/${state.qPerLevel}`;
  const step=currentStep();
  const qt=document.getElementById('qtext');
  if(!step){ qt.textContent=''; return; }
  qt.innerHTML=
    `<span class="qstep"><span class="stepicon">${step.icon}</span>${step.main}</span>`+
    (step.sub?`<span class="qsub">${step.sub}</span>`:'');
  // ステップが変わったときだけ軽くフラッシュして注意を引く
  if(flash!==false && step.main!==_lastStepMain){
    const bar=document.getElementById('questionbar');
    bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash');
  }
  _lastStepMain=step.main;
}
function configUIForLevel(){
  const lv=state.level;
  document.getElementById('hintBtn').style.display = (lv===0)?'none':'flex';
  document.getElementById('hintBtn').classList.remove('chosen');
  document.getElementById('extendBtn').style.display = (lv===2)?'flex':'none';
  document.getElementById('extendBtn').disabled = false;
  document.getElementById('auxBtn').style.display = (lv===4)?'flex':'none';
  document.getElementById('from360Btn').style.display = (lv===4)?'flex':'none';
  // ルーペ: level0(推定)・level3(直線分割)、および level1 の選択フェーズでは隠す。
  const hideLoupe = (lv===3 || lv===0 || (lv===1 && !state.measurePhase));
  document.getElementById('loupeBtn').style.display = hideLoupe?'none':'flex';
  document.getElementById('loupeBtn').classList.remove('on');
  document.getElementById('auxBtn').classList.remove('chosen');
  document.getElementById('from360Btn').classList.remove('chosen');
  // 2択UIを出す条件:
  //   level0(推定): 90度大小の2択（チャレンジ中はテンキー）。
  //   level1 の「選択フェーズ」: 90度大小の2択。
  //   level1/level2 の測定フェーズ: 1問目だけ2択、以降テンキー。
  const estChal=(lv===0 && state.estChallenge);
  const l1Choice=(lv===1 && !state.measurePhase);                 // 90度大小フェーズ
  const measureTwoChoice=( ((lv===1 && state.measurePhase)||lv===2)
                           && state.qIndex===0 );                  // 測定の1問目
  const twoChoice=( (lv===0 && !estChal) || l1Choice || measureTwoChoice );
  document.getElementById('keypad').style.display = twoChoice?'none':'grid';
  document.querySelector('.rightcol').style.display = twoChoice?'none':'flex';
  const ad=document.getElementById('ansDisplay'); if(ad) ad.style.display = twoChoice?'none':'flex';
  document.getElementById('choices').classList.toggle('show', twoChoice);
  if(twoChoice) buildChoices();
  else document.getElementById('choices').innerHTML='';
  // memo（level3=直線分割でのみ式メモを使う）
  document.getElementById('memoWrap').classList.toggle('show', lv===3);
  if(lv===3){ setMemo(`180 − ${state.q.known} = <span class="eq-result">？</span>`, false); }
  else { setMemo(''); }
}

/* ② 2択ボタンを作る（正解と「180−角度」をシャッフルして並べる） */
function buildChoices(){
  const q=state.q; const box=document.getElementById('choices');
  box.innerHTML='';
  // ① 見積もりレベル: 90度より大きい/小さいの2択
  if(q.level===0){
    const ql=document.createElement('div');
    ql.className='choice-q'; ql.textContent='この 角は 90度より…？';
    box.appendChild(ql);
    const opts=[
      {label:'小さい', icon:'🔻', val:'small'},
      {label:'大きい', icon:'🔺', val:'big'}
    ];
    for(const o of opts){
      const b=document.createElement('button');
      b.className='choice-btn est';
      b.innerHTML=`<span class="cdeg">90°より</span><span class="estbig">${o.icon} ${o.label}</span>`;
      b.onclick=()=>chooseAnswer(o.val,b);
      box.appendChild(b);
    }
    // ② 数あてチャレンジへの入口ボタン
    const chal=document.createElement('button');
    chal.className='est-challenge-btn';
    chal.innerHTML='🎯 すうじを あてる チャレンジ！';
    chal.onclick=()=>startEstChallenge();
    box.appendChild(chal);
    return;
  }
  // 新レベル1の「選択フェーズ」: 90度より大小を選ぶ（選ぶと分度器フェーズへ進む）
  if(q.level===1 && !state.measurePhase){
    const ql=document.createElement('div');
    ql.className='choice-q'; ql.textContent='この 角は 90度より…？';
    box.appendChild(ql);
    const opts=[
      {label:'小さい', icon:'🔻', val:'small'},
      {label:'大きい', icon:'🔺', val:'big'}
    ];
    for(const o of opts){
      const b=document.createElement('button');
      b.className='choice-btn est';
      b.innerHTML=`<span class="cdeg">90°より</span><span class="estbig">${o.icon} ${o.label}</span>`;
      b.onclick=()=>chooseCmp90(o.val,b);
      box.appendChild(b);
    }
    return;
  }
  const ql=document.createElement('div');
  ql.className='choice-q'; ql.textContent='この 角は どっち？';
  box.appendChild(ql);
  let opts=[q.target, q.distractor];
  if(opts[0]===opts[1]) opts=[q.target, q.target+5]; // 念のため重複回避
  if(Math.random()<0.5) opts.reverse();
  for(const v of opts){
    const b=document.createElement('button');
    b.className='choice-btn';
    b.innerHTML=`${v}<span class="cdeg">°</span>`;
    b.onclick=()=>chooseAnswer(v,b);
    box.appendChild(b);
  }
}
/* 新レベル1の選択フェーズ: 90度より大小を選んだら、正誤に応じて
   フィードバックし、正解なら分度器を出す測定フェーズへ進む。 */
function chooseCmp90(val,btn){
  haptic();
  document.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('picked'));
  btn.classList.add('picked');
  const correct = state.q.target<90 ? 'small' : 'big';
  if(val===correct){
    // 正答: フィードバックなしで すぐに分度器を表示
    enterMeasurePhase();
  }else{
    // 誤答: 90度ものさしを出し、正答を示してから分度器を表示
    const big = state.q.target>90;
    const msg = big ? '90度より 大きい 角だよ' : '90度より 小さい 角だよ';
    state.cmp90=true; render();
    toast(false, msg, 'よく見て、分度器で はかってみよう');
    setTimeout(enterMeasurePhase, 1600);
  }
}
/* 選択フェーズ → 測定フェーズへ。分度器を出して通常の測定操作に入る。 */
function enterMeasurePhase(){
  state.measurePhase=true;
  state.hint=false; state.cmp90=false;
  const hb=document.getElementById('hintBtn'); if(hb) hb.classList.remove('chosen');
  state.answer="";
  // 分度器を出す（newQuestion と同じ初期配置ロジック）
  const p=state.prot, R=protRadius();
  p.visible=true; p.vlock=false; p.elock=false; p.rot=0;
  p.x=clamp(state.q.cx, R+8, W-R-8);
  p.y=clamp(Math.max(H*0.46, R+110), R+8, H-8);
  configUIForLevel();   // 測定UI（1問目は2択、以降テンキー）へ
  renderAnswer();
  render();
  updateFlow();
}
/* ② 2択を選んだら即判定 */
function chooseAnswer(val,btn){
  haptic();
  document.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('picked'));
  btn.classList.add('picked');
  state.answer=String(val);
  renderAnswer();
  judge();
}
/* ② 見積もりレベルの「数あてチャレンジ」へ切り替える（テンキー入力で角度を予想） */
function startEstChallenge(){
  haptic();
  state.estChallenge=true;
  state.answer="";
  configUIForLevel();        // テンキー表示へ切り替え
  renderAnswer();
  updateFlow();              // 上のウィンドウを「何度かな？」案内へ
}
function helpnote(t){
  // 旧・画面下のヘルプは廃止。一時的な案内は上のウィンドウの sub 行に出し、
  // 通常の作業フローは updateFlow() が管理する。
  if(!t){ updateFlow(false); return; }
  const qt=document.getElementById('qtext');
  const step=currentStep();
  const main = step? step.main : '';
  const icon = step? step.icon : '💡';
  qt.innerHTML=
    `<span class="qstep"><span class="stepicon">${icon}</span>${main}</span>`+
    `<span class="qsub">${t}</span>`;
}
function showMemo(){ document.getElementById('memoWrap').classList.add('show'); }

/* tool buttons */
// ② ヒントはトグル式（押すたびにオン/オフ）。ルーペとは独立して共存する。
// ボタンは stage-wrap の子なので、押下イベントが下の SVG (pointerDown) に伝播し
// 「空きスペースのタップ」と誤判定されてルーペが解除されるのを防ぐため、
// pointerdown / mousedown / touchstart すべてで stopPropagation する。
// 押下時は SVG への伝播だけ止める（既定の click 合成は抑制しない）。
['pointerdown','mousedown','touchstart'].forEach(type=>{
  document.getElementById('hintBtn').addEventListener(type,e=>{
    e.stopPropagation();
  },{passive:true});
});
// 実際のトグルは pointerup で行う。PointerEvent はマウス／タッチ／ペンを
// 統一的に扱うため、タッチでも確実に発火する。click には依存しない。
document.getElementById('hintBtn').addEventListener('pointerup',e=>{
  e.stopPropagation();
  e.preventDefault();
  toggleHint();
});
// PointerEvent 非対応の古い環境向けフォールバック（pointerup と二重発火しない）。
if(!window.PointerEvent){
  document.getElementById('hintBtn').addEventListener('click',e=>{
    e.stopPropagation();
    toggleHint();
  });
}
function toggleHint(){
  const lv = state.q ? state.q.level : -1;
  // turning the hint ON
  if(!state.hint && !hintReady()){
    helpnote('分度器を ちょうてんに あわせ、0度の 線を へんに そろえてから ヒントを 押してね');
    return;
  }
  state.hint=!state.hint;
  // レベル1・2のヒントは「90度ものさし(比較図)」を一緒に出す/消す
  if(lv===1 || lv===2){ state.cmp90 = state.hint; }
  document.getElementById('hintBtn').classList.toggle('chosen',state.hint);
  render();
}
// is a hint available now?
// ① レベル1(鋭角＋鈍角)・レベル2(辺が短い): 90度ものさしで比べる方式なので、
//    分度器の配置を待たずに いつでも出せる。
// ② レベル3(直線分割): 分度器なしの 180° ヒントなのでいつでも出せる。
// ③ レベル4(180度超): 分度器を頂点に合わせ 0度線を辺にそろえた状態が必須。
function hintReady(){
  if(!state.q) return false;
  const lv=state.q.level;
  if(lv===1 || lv===2) return true;             // 90度ものさし方式
  if(lv===3) return true;                        // no protractor; 180° hint is fine
  if(state.prot.visible && state.prot.vlock && state.prot.elock) return true;
  return false;
}

document.getElementById('loupeBtn').addEventListener('click',function(){
  // ① ignore taps until the protractor is positioned to measure
  if(!loupeReady()){
    helpnote('分度器を 角の ちょうてんに あわせてから ルーペを 押してね🔍');
    return;
  }
  state.loupe=!state.loupe; this.classList.toggle('on',state.loupe);
  let note=null;
  if(!state.loupe){ state.loupeFocus=null; state.loupePart=null; }
  else if(state.level===4){
    state.loupeFocus=null;
    if(state.activePart){
      state.loupePart=state.activePart;
      note='この 角の 目もりを 拡大したよ。数字を よんで「？」に 入力しよう🔍';
    }else{
      state.loupePart=null;
      note='はかりたい 角の「？」を おすと、その 目もりが 拡大されるよ🔍';
    }
  }else{
    note='目もりを 拡大したよ。💡ヒントも いっしょに つかえるよ🔍';
  }
  render();
  if(note) helpnote(note);   // render() の後に出して上書きされないように
});
document.getElementById('extendBtn').addEventListener('click',function(){
  state.extended=true; this.disabled=true; render();
});
document.getElementById('auxBtn').addEventListener('click',function(){
  state.mode='aux'; state.prot.visible=false;
  state.auxAngle=norm360(state.q.rayA+ state.q.target/2); state.auxLocked=false; state.auxBase='A';
  state.partInputs={a:"",b:""}; state.activePart=null;
  this.classList.add('chosen'); document.getElementById('from360Btn').classList.remove('chosen');
  showMemo();
  document.getElementById('from360Btn').disabled=false;
  render();
});
document.getElementById('from360Btn').addEventListener('click',function(){
  state.mode='360'; state.prot.visible=true; state.auxAngle=null;
  state.partInputs={a:"",b:""}; state.activePart=null;
  // ② park the protractor UNLOCKED in a clear corner away from the figure,
  // so the child drags & drops it onto the vertex (same as the aux pattern).
  const p=state.prot, R=protRadius();
  p.rot=0; p.vlock=false; p.elock=false;
  p.x=clamp(W-R-20, R+20, W-R-20);
  p.y=clamp(R+30, R+20, H-30);
  if(dist(p.x,p.y,state.q.cx,state.q.cy) < R+60){ p.y=clamp(H-40, R+20, H-30); }
  this.classList.add('chosen'); document.getElementById('auxBtn').classList.remove('chosen');
  showMemo();
  render();
});

/* 内部レベル(0..4) → 画面表示レベル(1..5) */
function dispLevel(intLv){ return intLv+1; }
/* level pips */
function updatePips(){
  const c=document.getElementById('levelpips'); c.innerHTML='';
  for(let lv=0;lv<=4;lv++){
    const b=document.createElement('div');
    b.className='pip'+(lv===state.level?' active':'')+(state.levelDone[lv]?' done':'');
    b.textContent=dispLevel(lv); b.title='レベル'+dispLevel(lv);
    b.onclick=()=>{ closeModal(); startLevel(lv); };
    c.appendChild(b);
  }
}
function finishLevel(){
  state.levelDone[state.level]=true; updatePips();
  const next=state.level<4?state.level+1:null;
  const stars='⭐⭐⭐';
  openModal(`
    <div class="big">🏆</div>
    <h2>レベル${dispLevel(state.level)} クリア！</h2>
    <div class="stars">${stars}</div>
    <p>5もん ぜんぶ おわったよ！<br>いまの ⭐は <b>${state.score}</b>こ</p>
    ${next!=null?`<button onclick="window._next()">レベル${dispLevel(next)}へ ➜</button>`:`<button onclick="window._next()">🎉 ぜんぶ クリア！もういちど</button>`}
    <button class="alt" onclick="window._retry()">もういちど レベル${dispLevel(state.level)}</button>
  `);
  window._next=()=>{ closeModal(); if(next!=null){ startLevel(next); } else { state.levelDone=[false,false,false,false,false]; updatePips(); startLevel(0); } };
  window._retry=()=>{ closeModal(); startLevel(state.level); };
}
function allDone(){return state.levelDone.every(Boolean);}

/* modal + welcome */
function openModal(html,wide){ const card=document.getElementById('card'); card.innerHTML=html; card.classList.toggle('wide',!!wide); document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

function welcome(){
  openModal(`
    <div class="big">📐✨</div>
    <h2>分度器マスター <span style="font-size:.5em;font-weight:700;color:#b7a878;background:#fff;border:2px solid #e3d2a5;border-radius:8px;padding:1px 7px;vertical-align:middle;">v26</span></h2>
    <p>分度器の つかいかたを マスターしよう！</p>
    <div class="lvlpicker" id="lp"></div>
  `, true);
  const lp=document.getElementById('lp');
  const descs=[
    '分度器を 使わずに 大きさを 見つもろう',           // level0 (推定)
    '分度器を 使って はかろう（鋭角も 鈍角も）',       // level1 (鋭角＋鈍角混合)
    '辺が 短いときの はかり方を 知ろう',               // level2 (旧 level3)
    '分度器を 使わないで 求めよう',                     // level3 (直線分割)
    '180度より 大きな 角を はかろう'                    // level4 (旧 level5)
  ];
  for(let lv=0;lv<=4;lv++){
    const b=document.createElement('button');
    b.className='alt';
    b.innerHTML=`<span class="lvtag">レベル${dispLevel(lv)}</span><span>${descs[lv]}</span>`;
    b.onclick=()=>{closeModal();startLevel(lv);};
    lp.appendChild(b);
  }
  window._begin=()=>{closeModal();startLevel(0);};
}

/* ================= 計算メモ（③ 電卓を廃止し、？への入力で自動計算） =================
   レベル4・5で「？」に角度を入力すると、syncLevel5Answer / レベル4の入力処理が
   この setMemo を呼んで、式を大きく表示する。 */
function setMemo(html, hasValue){
  const m=document.getElementById('memo');
  if(!m) return;
  if(!html){
    m.innerHTML='<span class="memo-ph">「？」に 角度を 入れると しきが でるよ</span>';
    m.classList.remove('has-value');
    return;
  }
  const prev=m.dataset.expr||'';
  m.innerHTML=html;
  m.classList.toggle('has-value', !!hasValue);
  m.dataset.expr=html;
  // 式が更新されたら軽くフラッシュして「式ができたよ」と気づかせる
  if(hasValue && html!==prev){
    m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash');
  }
}
function closeCalc(){ /* 電卓は廃止。互換のための空関数 */ }

/* ================= TOAST / CONFETTI ================= */
let toastTimer;
function toast(good,msg,sub){
  const t=document.getElementById('toast');
  t.querySelector('.face').textContent=good?pick(['🎉','🌟','😆','👏','🥳']):'🤔';
  t.querySelector('.msg').textContent=msg;
  t.querySelector('.sub').textContent=sub||'';
  t.classList.toggle('bad',!good); t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), good?1300:1900);
}
function confettiBurst(){
  const wrap=document.getElementById('stage-wrap');
  const colors=['#ff7a59','#ffcf4d','#4ec5d6','#8bc34a','#e84393','#7c4dff'];
  for(let i=0;i<34;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.left=(40+Math.random()*20)+'%';
    c.style.top='42%';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
    const dx=(Math.random()-.5)*window.innerWidth*0.7;
    const dy=(Math.random()*-1-0.2)*window.innerHeight*0.45;
    if(c.animate){
      c.animate([
        {transform:`translate(0,0) rotate(0deg)`,opacity:1},
        {transform:`translate(${dx}px,${dy*-1+300}px) rotate(${Math.random()*720}deg)`,opacity:0}
      ],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'});
    }
    setTimeout(()=>c.remove(),1600);
  }
}

/* ================= BOOT ================= */
function boot(){ resize(); updatePips(); welcome(); }
window.addEventListener('load',()=>{ setTimeout(boot,60); });
</script>
