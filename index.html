<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>分度器マスター v26</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

  :root{
    --paper:#fdf6e3;
    --ink:#3a3226;
    --sky:#4ec5d6;
    --sky-dark:#2a9bad;
    --coral:#ff7a59;
    --coral-dark:#e8553a;
    --sun:#ffcf4d;
    --sun-dark:#f0b429;
    --grass:#8bc34a;
    --grass-dark:#689f38;
    --berry:#e84393;
    --proto:#7c4dff;
    --line:#5a4a3a;
    --hint:#ff4081;
    --shadow:rgba(90,74,58,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;
    font-family:'Zen Maru Gothic',sans-serif;
    overscroll-behavior:none;position:fixed;width:100%;
    -webkit-text-size-adjust:100%;}
  body{
    background:
      radial-gradient(circle at 12% 18%, #fff7df 0%, transparent 45%),
      radial-gradient(circle at 88% 80%, #ffe9d6 0%, transparent 45%),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(120,150,200,.07) 38px 39px),
      var(--paper);
    color:var(--ink);
    touch-action:manipulation;
    user-select:none;
  }
  #app{height:100%;height:100dvh;display:flex;flex-direction:column;}

  /* ---------- TOP BAR ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    padding-top:max(8px,env(safe-area-inset-top));
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
    background:linear-gradient(180deg,#fffdf6,#fcefcf);
    box-shadow:0 3px 0 #e9d9ab,0 6px 14px rgba(120,90,30,.12);
    z-index:30;position:relative;
  }
  .logo{font-weight:900;font-size:clamp(16px,3.6vw,24px);letter-spacing:.5px;
    color:var(--coral-dark);display:flex;align-items:center;gap:6px;white-space:nowrap;
    cursor:pointer;transition:transform .1s;}
  .logo:active{transform:scale(.94);}
  .logo .gizmo{font-size:1.25em;transform:rotate(-12deg);display:inline-block;}
  .logo .ver{font-size:.5em;font-weight:700;color:#b7a878;background:#fff;
    border:2px solid #e3d2a5;border-radius:8px;padding:1px 6px;margin-left:6px;
    align-self:center;letter-spacing:.5px;}
  .levelpips{display:flex;gap:5px;margin-left:6px;}
  .pip{width:clamp(20px,4.4vw,30px);height:clamp(20px,4.4vw,30px);border-radius:50%;
    display:grid;place-items:center;font-weight:900;font-size:clamp(11px,2.3vw,15px);
    background:#fff;border:2.5px solid #e3d2a5;color:#b7a878;cursor:pointer;transition:.15s;}
  .pip.active{background:var(--sky);border-color:var(--sky-dark);color:#fff;transform:scale(1.12);
    box-shadow:0 3px 0 var(--sky-dark);}
  .pip.done{background:var(--grass);border-color:var(--grass-dark);color:#fff;}
  .spacer{flex:1;}
  .score{font-weight:900;font-size:clamp(13px,2.8vw,18px);color:var(--grass-dark);
    background:#fff;border:2.5px solid #cfe6a8;border-radius:14px;padding:3px 12px;
    display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 #cfe6a8;white-space:nowrap;}

  /* ---------- MAIN ---------- */
  main{flex:1 1 auto;display:flex;min-height:0;}
  #stage-wrap{flex:1 1 auto;position:relative;min-width:0;display:flex;flex-direction:column;touch-action:none;}
  .questionbar{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.94);border:3px solid var(--sun);border-radius:16px;
    padding:6px 14px;font-weight:700;font-size:clamp(12px,2.4vw,17px);
    box-shadow:0 4px 0 var(--sun-dark),0 8px 16px var(--shadow);
    z-index:12;text-align:center;max-width:min(560px,84%);color:var(--ink);
    display:flex;align-items:center;gap:8px;line-height:1.3;
    backdrop-filter:blur(2px);
  }
  .questionbar .qnum{background:var(--coral);color:#fff;border-radius:10px;padding:1px 9px;font-weight:900;font-size:.85em;flex:0 0 auto;}
  /* 作業フローのステップ表示（上のウィンドウに統合された旧helpnote） */
  .questionbar #qtext{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .questionbar .qstep{display:flex;align-items:center;gap:6px;font-weight:900;}
  .questionbar .qstep .stepicon{font-size:1.15em;}
  .questionbar .qsub{font-size:.78em;font-weight:700;color:#9a8a6e;}
  .questionbar.flash{animation:qbFlash .5s;}
  @keyframes qbFlash{0%{transform:translateX(-50%) scale(1);}40%{transform:translateX(-50%) scale(1.05);border-color:var(--coral);}100%{transform:translateX(-50%) scale(1);}}
  svg#stage{flex:1;width:100%;height:100%;display:block;touch-action:none;}

  /* floating tool buttons (left side of stage) */
  .toolcol{position:absolute;left:10px;top:60px;display:flex;flex-direction:column;gap:9px;z-index:14;}
  .toolbtn{
    width:clamp(46px,9vw,58px);height:clamp(46px,9vw,58px);border-radius:16px;border:none;
    background:linear-gradient(180deg,#fff,#fdeccb);box-shadow:0 4px 0 #e3c98d,0 6px 12px var(--shadow);
    font-size:clamp(20px,4.6vw,26px);cursor:pointer;display:grid;place-items:center;transition:.1s;
    position:relative;
  }
  .toolbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e3c98d;}
  .toolbtn.on{background:linear-gradient(180deg,var(--sun),var(--sun-dark));box-shadow:0 4px 0 #c99211;}
  .toolbtn .cap{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    font-size:9px;font-weight:900;background:var(--ink);color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap;}
  .toolbtn:disabled{opacity:.35;cursor:default;filter:grayscale(.6);}

  .actioncol{position:absolute;right:10px;top:60px;display:flex;flex-direction:column;gap:9px;z-index:14;align-items:flex-end;}
  .bigaction{
    border:none;border-radius:16px;padding:10px 14px;font-family:inherit;font-weight:900;
    font-size:clamp(12px,2.5vw,15px);cursor:pointer;transition:.1s;display:flex;align-items:center;gap:6px;
    box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 12px var(--shadow);color:#fff;white-space:nowrap;
  }
  .bigaction:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .a-hint{background:linear-gradient(180deg,#ff9bb4,var(--hint));}
  .a-extend{background:linear-gradient(180deg,#9fd86a,var(--grass-dark));}
  .a-aux{background:linear-gradient(180deg,#9b7bff,var(--proto));}
  .a-360{background:linear-gradient(180deg,#5fd3e2,var(--sky-dark));}
  .bigaction:disabled{opacity:.4;cursor:default;filter:grayscale(.5);}
  .bigaction.chosen{outline:4px solid #fff;outline-offset:-2px;}

  /* ---------- RIGHT PANEL ---------- */
  #panel{
    flex:0 0 clamp(220px,30vw,300px);background:linear-gradient(180deg,#fffdf7,#f6ecd2);
    box-shadow:-4px 0 0 #ead9ad,-8px 0 18px rgba(120,90,30,.1);
    display:flex;flex-direction:column;padding:12px;gap:10px;z-index:20;overflow:hidden;
  }
  .ans-display{
    background:#fff;border:3px solid var(--sky);border-radius:16px;min-height:62px;
    display:flex;align-items:center;justify-content:center;gap:4px;
    font-weight:900;font-size:clamp(28px,6vw,40px);color:var(--ink);
    box-shadow:inset 0 3px 0 #d9f0f4;position:relative;
  }
  .ans-display .deg{font-size:.55em;color:var(--sky-dark);margin-left:2px;}
  .ans-display .ph{color:#c9bfa8;}
  .ans-display .cursor{width:3px;height:.85em;background:var(--coral);animation:blink 1s steps(2) infinite;border-radius:2px;}
  @keyframes blink{50%{opacity:0;}}

  /* ② レベル1〜3の 2択ボタン */
  .choices{display:none;flex-direction:column;gap:10px;}
  .choices.show{display:flex;}
  .choice-q{font-weight:900;font-size:clamp(14px,3vw,18px);color:var(--sky-dark);text-align:center;margin:2px 0;}
  .choice-btn{
    border:4px solid var(--sky);border-radius:18px;padding:16px 12px;
    font-family:inherit;font-weight:900;font-size:clamp(26px,6vw,38px);color:var(--ink);
    background:linear-gradient(180deg,#fff,#eafafc);cursor:pointer;transition:.1s;
    box-shadow:0 5px 0 var(--sky-dark),0 7px 12px var(--shadow);
    display:flex;align-items:center;justify-content:center;gap:2px;
  }
  .choice-btn .cdeg{font-size:.55em;color:var(--sky-dark);}
  .choice-btn.est{flex-direction:column;gap:4px;font-size:clamp(18px,4.6vw,26px);padding:14px 8px;}
  .choice-btn.est .cdeg{font-size:.7em;}
  .choice-btn.est .estbig{font-size:1em;white-space:nowrap;}
  .choice-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-dark);}
  .choice-btn.picked{background:linear-gradient(180deg,var(--sun),var(--sun-dark));border-color:var(--sun-dark);box-shadow:0 5px 0 #c99211;}
  /* ② 見積もり「数あてチャレンジ」入口ボタン */
  .est-challenge-btn{
    border:4px solid var(--berry);border-radius:18px;padding:12px 10px;
    font-family:inherit;font-weight:900;font-size:clamp(15px,3.6vw,21px);color:#fff;
    background:linear-gradient(180deg,#ff79b6,var(--berry));cursor:pointer;transition:.1s;
    box-shadow:0 5px 0 #b32d72,0 7px 12px var(--shadow);
    display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px;
  }
  .est-challenge-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b32d72;}

  .memo-wrap{display:none;flex-direction:column;gap:5px;}
  .memo-wrap.show{display:flex;}
  .memo-label{font-weight:900;font-size:14px;color:var(--proto);display:flex;align-items:center;gap:4px;}
  .memo{width:100%;border:3px dashed var(--proto);border-radius:16px;background:#faf7ff;
    font-family:inherit;font-weight:900;font-size:clamp(24px,5.4vw,34px);color:var(--proto);
    padding:16px 12px;min-height:64px;display:flex;align-items:center;justify-content:center;
    text-align:center;line-height:1.25;word-break:break-word;
    box-shadow:inset 0 3px 0 #ece2ff;transition:.15s;}
  .memo.has-value{background:#fff;border-style:solid;border-color:var(--grass-dark);color:var(--ink);
    box-shadow:inset 0 3px 0 #e6f3d6,0 0 0 0 var(--grass);}
  .memo.flash{animation:memoFlash .55s;}
  @keyframes memoFlash{0%{transform:scale(1);}40%{transform:scale(1.06);box-shadow:0 0 0 6px rgba(139,195,74,.35);}100%{transform:scale(1);}}
  .memo .memo-ph{color:#c4b3f0;font-weight:700;font-size:14px;}
  .memo .eq-result{color:var(--coral-dark);}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;}
  .key{
    border:none;border-radius:14px;padding:0;height:clamp(44px,9vw,58px);
    font-family:inherit;font-weight:900;font-size:clamp(20px,4.4vw,26px);cursor:pointer;transition:.08s;
    background:linear-gradient(180deg,#fff,#f3e8cf);color:var(--ink);
    box-shadow:0 4px 0 #ddca9e,0 5px 9px var(--shadow);
  }
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 #ddca9e;}
  .key.del{background:linear-gradient(180deg,#ffd2c4,#ffb59e);color:var(--coral-dark);box-shadow:0 4px 0 #e89077;}
  .key.clr{background:linear-gradient(180deg,#ffe6a8,#ffd35e);color:#9c6b00;box-shadow:0 4px 0 #e0b22e;
    font-size:clamp(13px,2.8vw,17px);letter-spacing:-.5px;}
  .key.zero{grid-column:span 1;}

  .submit{
    border:none;border-radius:16px;padding:13px;font-family:inherit;font-weight:900;
    font-size:clamp(17px,3.8vw,22px);cursor:pointer;color:#fff;letter-spacing:1px;
    background:linear-gradient(180deg,#ffb04d,var(--coral));box-shadow:0 5px 0 var(--coral-dark),0 8px 14px var(--shadow);
    transition:.1s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .submit:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-dark);}

  /* ---------- FEEDBACK + OVERLAYS ---------- */
  #toast{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
    background:#fff;border-radius:24px;padding:22px 30px;text-align:center;z-index:60;
    box-shadow:0 12px 40px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:.25s cubic-bezier(.2,1.3,.4,1);
    border:5px solid var(--sun);min-width:200px;
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #toast.bad{border-color:var(--sky);}
  #toast .face{font-size:54px;line-height:1;}
  #toast .msg{font-weight:900;font-size:22px;margin-top:6px;color:var(--coral-dark);}
  #toast.bad .msg{color:var(--sky-dark);}
  #toast .sub{font-weight:700;font-size:14px;margin-top:5px;color:#8a7a64;}

  .confetti{position:absolute;width:12px;height:12px;z-index:55;pointer-events:none;border-radius:2px;}

  /* level complete / welcome modal */
  #modal{
    position:absolute;inset:0;background:rgba(58,50,38,.55);z-index:80;display:none;
    align-items:center;justify-content:center;backdrop-filter:blur(3px);
    padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #modal.show{display:flex;}
  .card{
    background:linear-gradient(180deg,#fffef9,#fdeccb);border-radius:26px;padding:26px 28px;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.3);border:6px solid var(--sun);max-width:88%;width:380px;
    animation:pop .35s cubic-bezier(.2,1.3,.4,1);
    max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:auto;
  }
  @keyframes pop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
  .card h2{margin:.2em 0;font-size:26px;color:var(--coral-dark);}
  .card .big{font-size:60px;line-height:1.1;}
  .card p{font-weight:700;color:#7a6a54;margin:.5em 0 1.2em;font-size:15px;line-height:1.5;}
  .card .stars{font-size:34px;letter-spacing:4px;margin:.2em 0;}
  .card button{
    border:none;border-radius:16px;padding:13px 28px;font-family:inherit;font-weight:900;font-size:18px;
    color:#fff;cursor:pointer;background:linear-gradient(180deg,#ffb04d,var(--coral));
    box-shadow:0 5px 0 var(--coral-dark);transition:.1s;margin:4px;
  }
  .card button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-dark);}
  .card button.alt{background:linear-gradient(180deg,#5fd3e2,var(--sky-dark));box-shadow:0 5px 0 #1f7d8c;}

  /* ---------- (電卓は廃止: ③ ？への入力で自動計算されるメモに置換) ---------- */

  .lvlpicker{display:flex;flex-direction:column;gap:9px;margin:14px 0 6px;}
  .lvlpicker button{padding:14px 18px;font-size:16px;border-radius:14px;text-align:left;
    display:flex;align-items:center;gap:12px;line-height:1.3;}
  .lvlpicker button .lvtag{flex:0 0 auto;background:rgba(255,255,255,.85);color:var(--sky-dark);
    font-weight:900;border-radius:10px;padding:3px 10px;font-size:15px;}
  .card.wide{width:min(620px,92%);max-width:92%;}
  .card.wide p{font-size:16px;}
  .card.wide h2{font-size:30px;}

  /* (旧 helpnote は questionbar に統合) */

  /* タブレット帯（横:サイドパネル配置だが画面が広く、上のウィンドウが大きく
     なりすぎて分度器に重なりがちなのでコンパクト化する） */
  @media(min-width:721px) and (max-width:1180px){
    .questionbar{
      top:6px;padding:5px 12px;font-size:clamp(12px,1.7vw,16px);
      max-width:min(440px,52%);border-width:2.5px;border-radius:14px;
    }
    .questionbar .qsub{font-size:.74em;}
  }

  @media(max-width:720px){
    main{flex-direction:column;}
    #stage-wrap{flex:1 1 auto;min-height:0;}
    #panel{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:stretch;
      box-shadow:0 -4px 0 #ead9ad;padding:8px;gap:7px;
      padding-bottom:calc(8px + env(safe-area-inset-bottom));}
    .ans-display{flex:1 1 100%;min-height:48px;font-size:30px;order:1;}
    .choices{flex:1 1 100%;order:2;}
    .choices.show{flex-direction:row;gap:10px;flex-wrap:wrap;}
    .choices.show .choice-q{flex:1 1 100%;margin:0;order:1;}
    .choices.show .est-challenge-btn{flex:0 0 100%;order:3;width:100%;}
    .choices.show .choice-btn{flex:1 1 0;padding:14px 6px;order:2;}
    .memo-wrap{flex:1 1 100%;order:2;}
    .keypad{order:4;flex:1 1 58%;margin-top:0;gap:6px;}
    .key{height:42px;font-size:20px;}
    .rightcol{order:3;flex:1 1 36%;display:flex;flex-direction:column;gap:7px;justify-content:flex-end;}
    .submit{padding:10px;}
    .toolcol{top:54px;}
    .actioncol{top:54px;}
    .questionbar{top:5px;padding:5px 12px;font-size:clamp(11px,2.9vw,15px);
      max-width:min(360px,90%);border-width:2.5px;}
    .questionbar .qsub{font-size:.76em;}
  }

  /* 横向き・縦が低い画面: パネルを右側の縦並びに戻し、
     こたえるボタンが画面外に出ないようスクロール可能にする */
  @media(max-height:520px) and (orientation:landscape){
    main{flex-direction:row;}
    #panel{flex:0 0 clamp(200px,32vw,280px);flex-direction:column;flex-wrap:nowrap;
      overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:8px;gap:7px;box-shadow:-4px 0 0 #ead9ad;}
    .ans-display{flex:0 0 auto;min-height:44px;font-size:26px;}
    .choices{flex:0 0 auto;}
    .choices.show{flex-direction:column;}
    .memo-wrap{flex:0 0 auto;}
    .keypad{flex:0 0 auto;margin-top:0;gap:6px;}
    .key{height:clamp(34px,7vh,46px);font-size:20px;}
    .rightcol{flex:0 0 auto;}
    .submit{padding:10px;font-size:18px;}
    .toolcol{top:50px;gap:7px;}
    .actioncol{top:50px;gap:7px;}
    .questionbar{top:6px;padding:5px 14px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="logoBtn" onclick="welcome()" title="イントロにもどる"><span class="gizmo">📐</span>分度器マスター<span class="ver">v26</span></div>
    <div class="levelpips" id="levelpips"></div>
    <div class="spacer"></div>
    <div class="score">⭐ <span id="score">0</span></div>
  </header>

  <main>
    <div id="stage-wrap">
      <div class="questionbar" id="questionbar"><span class="qnum" id="qnum">1/5</span><span id="qtext">…</span></div>

      <div class="toolcol" id="toolcol">
        <button class="toolbtn" id="loupeBtn" title="拡大">🔍<span class="cap">ルーペ</span></button>
      </div>

      <div class="actioncol" id="actioncol">
        <button class="bigaction a-hint" id="hintBtn">💡ヒント</button>
        <button class="bigaction a-extend" id="extendBtn" style="display:none">📏へんを のばす</button>
        <button class="bigaction a-aux" id="auxBtn" style="display:none">✏️補助線を引く</button>
        <button class="bigaction a-360" id="from360Btn" style="display:none">🔄360度から引く</button>
      </div>

      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <aside id="panel">
      <div class="ans-display" id="ansDisplay"><span class="ph">?</span></div>
      <div class="choices" id="choices"></div>
      <div class="memo-wrap" id="memoWrap">
        <div class="memo-label">📝 けいさんメモ</div>
        <div class="memo" id="memo"><span class="memo-ph">「？」に 角度を 入れると しきが でるよ</span></div>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key clr" data-k="C">ぜんけし</button>
        <button class="key zero" data-k="0">0</button>
        <button class="key del" data-k="DEL">⌫</button>
      </div>
      <div class="rightcol">
        <button class="submit" id="submitBtn">⭕ こたえる</button>
      </div>
    </aside>
  </main>

  <div id="toast"><div class="face">🎉</div><div class="msg">せいかい！</div><div class="sub"></div></div>
  <div id="modal"><div class="card" id="card"></div></div>
</div>

<script>
/* ======================================================================
   分度器マスター  -  小学4年生 角度学習アプリ
   SVG による精密描画・スナップ・回転・ヒント演出
====================================================================== */
const SVGNS="http://www.w3.org/2000/svg";
const stage=document.getElementById('stage');
let W=0,H=0;            // stage size in svg user units (= px)
function resize(){
  const r=stage.getBoundingClientRect();
  W=r.width;H=r.height;
  stage.setAttribute('viewBox',`0 0 ${W} ${H}`);
  // viewBox is kept EXACTLY equal to the displayed pixel size, and we force a
  // 1:1 mapping (no letterboxing). Without this, any drift between the viewBox
  // aspect-ratio and the element's real size (e.g. the mobile address bar
  // growing/shrinking only the height) makes the default "xMidYMid meet"
  // re-centre & scale everything — so the drawn protractor no longer sits at
  // its logical (p.x,p.y) coordinates, and a static tap on it misses while a
  // tap slightly off it hits. "none" + a synced viewBox guarantees screen px
  // == user units, so hit-testing always matches what is drawn.
  stage.setAttribute('preserveAspectRatio','none');
  // ① re-centre the figure (and a centred, unmoved protractor) for the new size
  if(state.q){
    const oldCx=state.q.cx, oldCy=state.q.cy;
    const [ncx,ncy]=figureCenter();
    state.q.cx=ncx; state.q.cy=ncy;
    const p=state.prot;
    // if the protractor was sitting on the vertex, keep it there; otherwise shift
    // it by the same delta so it stays in the same relative spot and on-screen.
    if(p.vlock){ p.x=ncx; p.y=ncy; }
    else { p.x+=(ncx-oldCx); p.y+=(ncy-oldCy); }
    const R=protRadius();
    p.x=clamp(p.x, R+8, W-R-8);
    p.y=clamp(p.y, R+8, H-8);
    render();
  }
}
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(resize,120);});
window.addEventListener('orientationchange',()=>{clearTimeout(window._rt);window._rt=setTimeout(resize,250);});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(resize,120);});
}

/* ---------------- helpers ---------------- */
const TAU=Math.PI*2, D2R=Math.PI/180, R2D=180/Math.PI;
function el(tag,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function norm360(a){a%=360;if(a<0)a+=360;return a;}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function ptOnLine(cx,cy,deg,len){return [cx+Math.cos(deg*D2R)*len, cy+Math.sin(deg*D2R)*len];}
// We use math convention but screen Y is down; for angle drawing we keep degrees measured
// counter-clockwise from +X by negating y. helper to convert "up-positive" angle:
function polar(cx,cy,deg,len){ // deg measured CCW from east, screen coords
  return [cx+Math.cos(-deg*D2R)*len, cy+Math.sin(-deg*D2R)*len];
}
// screen-angle (degrees CCW-from-east, y-up) of vector vertex->point
function angleOf(vx,vy,px,py){ return norm360(Math.atan2(-(py-vy), px-vx)*R2D); }

/* ① Figure vertex placement.
   Keep the vertex centred within the *usable* stage area so neither the figure
   nor the protractor gets pushed off the right edge on small screens. The left
   tool column and right action column overlay the stage, so we inset by their
   approximate widths and centre the vertex in what remains. */
function figureCenter(){
  const leftInset  = 76;   // tool column (loupe) ~58px + margin
  const rightInset = 110;  // action column (hint/extend etc.) width + margin
  const usableL = leftInset;
  const usableR = Math.max(usableL+40, W - rightInset);
  let cx = (usableL + usableR) / 2;
  // make sure the widest thing (protractor radius) still fits on both sides
  const R = protRadius();
  cx = clamp(cx, R+10, W - R - 10);
  if(W - R - 10 < R+10) cx = W/2;   // very narrow screen fallback
  const cy = clamp(H*0.58, R+50, H-40);
  return [cx, cy];
}

/* ================= GLOBAL STATE ================= */
const state={
  level:0, qIndex:0, qPerLevel:5, score:0,
  levelDone:[false,false,false,false,false],
  q:null,            // current question object
  answer:"",         // typed answer
  // protractor
  prot:{x:0,y:0,rot:0,vlock:false,elock:false,visible:false,scale:1},
  drag:null,
  hint:false,
  loupe:false,
  loupeFocus:null,  // {x,y} tapped focus point for the magnifier (level4)
  loupePart:null,   // level4 aux: which "?" part the loupe is magnifying ('a'|'b')
  extended:false,    // level2 (short edges)
  auxAngle:null,     // level4 aux line current angle (screen deg)
  auxLocked:false,
  auxBase:'A',       // ⑥ which ray the aux line extends: 'A' (rayA) or 'B' (rayB)
  mode:null,         // level4: 'aux' | '360'
  pointers:{},
  // level4 tappable angle parts (⑥⑦): values typed into the "?" markers on the figure
  partInputs:{a:"",b:""},   // a = first part (e.g. 180), b = second part (e.g. □)
  activePart:null,          // which part the keypad currently edits: 'a' | 'b' | null
  estChallenge:false,       // ② 見積もりレベル(0)の「数あてチャレンジ」モードか
  // v24: 新レベル1（鋭角＋鈍角混合）は2フェーズ。
  //   measurePhase=false → 90度より大小を選ぶフェーズ（分度器なし）
  //   measurePhase=true  → 分度器を出して測定するフェーズ
  measurePhase:false,
  cmp90:false,              // レベル1・2のヒント: 90度ものさし(比較図)の表示中か
};

/* ================= QUESTION GENERATION ================= */
// pick from list without immediate repeat
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function genQuestion(level){
  // vertex placed in stage; rays drawn. measured angle is between ray A (start) and ray B.
  // We define base direction and the opening angle. Colors etc.
  const [cx,cy]=figureCenter();
  let target, baseDir, q={level,cx,cy};
  if(level===0){ // ① 見積もりレベル: 分度器を使わず 0〜180度の角を見て
                 //    90度より大きい/小さいを当てる。90度ちょうど付近は避ける。
    target=pick([20,25,30,35,40,45,50,55,60,70,75,
                 105,110,115,120,125,130,140,150,160,165,170]);
    q.target=target;
    q.estimate=true;
    baseDir=pick([0,0,0,10,20,180,200,330]); // 多くは水平で読みやすく
    q.rayA=norm360(baseDir);
    q.rayB=norm360(baseDir+target);
    return q;
  }
  // ── 新レベル割り当て（v24で L2/L3 統合・全体を 0〜4 に詰めた） ──
  //   level1 : 鋭角＋鈍角の混合（90度より大小を選んでから 分度器で測る）
  //   level2 : 辺が短い角（旧 level3。辺をのばして測る）
  //   level3 : 直線分割（旧 level4。180 − □）
  //   level4 : 180度より大きい角（旧 level5。aux / 360）
  if(level===1){ // ① 鋭角・鈍角を混ぜて出題（90度ちょうど付近は避ける）
    target=pick([20,25,30,35,40,45,50,55,60,65,70,75,80,85,
                 95,100,110,115,120,125,130,135,140,145,150,160,165,170,175]);
  }else if(level===2){ // short edges, any acute/obtuse（旧 level3）
    target=pick([35,40,55,70,110,120,135,140,150]);
  }else if(level===3){ // straight-line split, ask the ? part（旧 level4）
    const known=pick([25,30,40,45,50,55,60,65,70,75,110,115,120,125,130,135,140]);
    q.known=known; target=180-known; q.straight=true;
  }else{ // level4 reflex 185..355（旧 level5。avoid 180/360）
    target=pick([200,210,220,225,230,240,250,260,270,280,290,300,315,320,330,340,350]);
  }
  q.target=target;

  // ② レベル1・2は2択（1問目のみ／レベル1は90度大小フェーズ後の測定）。
  // 分度器の内・外の目もりの よみまちがいを表す「180 − 角度」を まぎらわしい
  // もう一方の選択肢にする（例: 60↔120, 55↔125）。
  if(level===1||level===2){
    q.distractor=180-target;
  }

  if(level===3){
    // horizontal straight line through vertex; one ray goes up dividing it.
    baseDir=0; // ray to the right (0°) and left (180°)
    q.rayLeft=180; q.rayRight=0;
    q.divider=q.known; // measured from right ray (0°) CCW = known angle, "?" is 180-known on left side
  }else if(level===4){
    baseDir = pick([0,15,25,40,55,180,200,330]);
    q.rayA=norm360(baseDir);
    q.rayB=norm360(baseDir+target); // reflex opening measured CCW from A to B (the big side)
  }else{
    // ③ first question of levels 1-2: one edge horizontal (baseDir = 0)
    if(state.qIndex===0 && (level===1||level===2)){
      baseDir=0;
    }else{
      baseDir = pick([0,10,20,30,40,50,180,200,300,330]);
    }
    q.rayA=norm360(baseDir);
    q.rayB=norm360(baseDir+target);
  }
  return q;
}

/* ================= RENDER ================= */
let layers={};
let pendingParts=[];   // ④ level5 tappable "?" labels, drawn above the protractor
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); layers={}; }
// draw the collected level-5 "?" tap labels onto the top 'parts' layer
function drawParts(){
  if(!layers.parts) return;
  for(const args of pendingParts){ labelInput(layers.parts, ...args); }
}

function render(){
  clearStage();
  pendingParts=[];
  const q=state.q; if(!q) return;
  // defs (filters/markers)
  const defs=el('defs',{});
  defs.innerHTML=`
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(90,74,58,.25)"/>
    </filter>
    <radialGradient id="protFill" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,.16)"/>
      <stop offset="70%" stop-color="rgba(245,247,250,.20)"/>
      <stop offset="100%" stop-color="rgba(235,240,246,.12)"/>
    </radialGradient>`;
  stage.appendChild(defs);

  layers.bg=el('g',{}); stage.appendChild(layers.bg);
  layers.fig=el('g',{}); stage.appendChild(layers.fig);     // angle figure
  layers.prot=el('g',{}); stage.appendChild(layers.prot);   // protractor
  layers.parts=el('g',{}); stage.appendChild(layers.parts); // level5 "?" tap labels (ABOVE protractor)
  layers.hint=el('g',{}); stage.appendChild(layers.hint);   // hint overlay (in front of protractor)
  layers.loupe=el('g',{}); stage.appendChild(layers.loupe); // magnifier (topmost)

  drawFigure();
  if(state.prot.visible) drawProtractor();
  drawParts();   // ④ draw the tappable "?" labels on top so they're pressable over the protractor
  drawHint();
  if(state.loupe) drawLoupe();
  updateLoupeBtn();
  if(state.q) updateFlow();   // ④ 分度器の状態に応じて上のウィンドウのステップを更新
}

/* ① The loupe is only useful once the protractor is placed so an angle can be
   read. Enable the button only when the protractor is locked on the vertex
   (same condition as the hint). When it becomes unavailable, also turn any
   active magnifier off. */
function loupeReady(){
  if(!state.q) return false;
  if(state.q.level===3) return false;            // no protractor in level 3 (直線分割)
  if(state.q.level===1 && !state.measurePhase) return false; // L1 選択フェーズ
  return state.prot.visible && state.prot.vlock; // locked on the angle vertex
}
function updateLoupeBtn(){
  const btn=document.getElementById('loupeBtn');
  if(!btn) return;
  if(state.q && (state.q.level===3 || (state.q.level===1 && !state.measurePhase))){ btn.style.display='none'; return; }
  const ready=loupeReady();
  btn.disabled=!ready;
  if(!ready && state.loupe){
    state.loupe=false; state.loupeFocus=null; state.loupePart=null;
    btn.classList.remove('on');
  }
}

/* ---- the angle figure (rays + vertex + arc) ---- */
function drawFigure(){
  const q=state.q, g=layers.fig;
  const cx=q.cx, cy=q.cy;

  if(q.level===3){
    // horizontal line
    const [lx,ly]=polar(cx,cy,180,rayLen(260));
    const [rx,ry]=polar(cx,cy,0,rayLen(260));
    g.appendChild(el('line',{x1:lx,y1:ly,x2:rx,y2:ry,stroke:'var(--line)','stroke-width':3,'stroke-linecap':'round'}));
    // divider ray (upward)
    const [dx,dy]=polar(cx,cy,q.divider,rayLen(230));
    g.appendChild(el('line',{x1:cx,y1:cy,x2:dx,y2:dy,stroke:'var(--coral)','stroke-width':3,'stroke-linecap':'round'}));
    // known angle (right side, between 0° and divider)
    drawAngleArc(g,cx,cy,0,q.divider,34,'var(--grass-dark)');
    labelAngle(g,cx,cy,q.divider/2,58,q.known+'°','var(--grass-dark)');
    // ? angle (left side between divider and 180)
    drawAngleArc(g,cx,cy,q.divider,180,48,'var(--berry)');
    labelAngle(g,cx,cy,(q.divider+180)/2,74,'?','var(--berry)',true);
    vertexDot(g,cx,cy);
    return;
  }

  // ③ Level-4 loupe emphasis: while the magnifier is on, shade the angle being
  // measured (translucent pink wedge) and paint its two edges red, so it's clear
  // which lines the loupe is reading. Drawn FIRST so the rays/arcs sit on top,
  // and on the fig layer so it is cloned into the magnified view too.
  // In aux mode, only draw it once the child has tapped a "?" part to choose
  // which angle to magnify.
  const showEmphasis = q.level===4 && state.loupe &&
    (state.mode!=='aux' || (state.mode==='aux' && state.loupePart));
  if(showEmphasis){ drawMeasureEmphasis(g,cx,cy); }

  // generic two-ray angle (levels 1,2,4)
  let len = q.level===2 ? 64 : rayLen(235);
  const [ax,ay]=polar(cx,cy,q.rayA,len);
  const [bx,by]=polar(cx,cy,q.rayB,len);
  // extension dotted (level2: 短い辺 after extend)
  const fullLen=rayLen(235);
  if(q.level===2 && state.extended){
    const [ax2,ay2]=polar(cx,cy,q.rayA,fullLen);
    const [bx2,by2]=polar(cx,cy,q.rayB,fullLen);
    g.appendChild(el('line',{x1:ax,y1:ay,x2:ax2,y2:ay2,stroke:'var(--grass-dark)','stroke-width':4,'stroke-dasharray':'2 9','stroke-linecap':'round'}));
    g.appendChild(el('line',{x1:bx,y1:by,x2:bx2,y2:by2,stroke:'var(--grass-dark)','stroke-width':4,'stroke-dasharray':'2 9','stroke-linecap':'round'}));
  }
  g.appendChild(el('line',{x1:cx,y1:cy,x2:ax,y2:ay,stroke:'var(--line)','stroke-width':3.5,'stroke-linecap':'round'}));
  g.appendChild(el('line',{x1:cx,y1:cy,x2:bx,y2:by,stroke:'var(--line)','stroke-width':3.5,'stroke-linecap':'round'}));

  // angle arc (the side we measure: from A to B going CCW)
  if(q.level===4){
    pendingParts=[];   // ④ collected here, drawn after the protractor in drawParts()
    // colors for the two split parts (⑥): kept in sync with their ? labels
    const COL_A='var(--proto)';   // first part (rayA → aux, = 180°)
    const COL_B='var(--berry)';   // second part (aux → rayB, = □)
    // aux line (pattern A) — extends along ray A OR ray B (⑥)
    if(state.mode==='aux' && state.auxAngle!=null){
      const locked=state.auxLocked;
      // The reflex angle is measured rayA → rayB (CCW). The auxiliary straight
      // line splits it into a 180° part and a (target-180)° part. Which part is
      // first depends on which ray the aux line extends:
      //   auxBase 'A': rayA →(180°)→ aux →(□)→ rayB   → part 'a'=180, 'b'=□
      //   auxBase 'B': rayA →(□)→ aux →(180°)→ rayB   → part 'a'=□,  'b'=180
      if(locked){
        // ⑥ split arc into two colored segments matching the ? labels
        drawAngleArc(g,cx,cy,q.rayA,state.auxAngle,42,COL_A);
        drawAngleArc(g,cx,cy,state.auxAngle,q.rayB,42,COL_B);
      }else{
        drawAngleArc(g,cx,cy,q.rayA,q.rayB,42,COL_B);
      }
      const [px,py]=polar(cx,cy,state.auxAngle,fullLen+10);
      // when locked, the line becomes solid black to signal it's fixed straight
      const ln=el('line',{x1:cx,y1:cy,x2:px,y2:py,
        stroke:locked?'var(--ink)':'var(--proto)','stroke-width':locked?5:4,
        'stroke-dasharray':locked?'none':'8 6','stroke-linecap':'round'});
      g.appendChild(ln);
      // handle
      const hd=el('circle',{cx:px,cy:py,r:14,fill:locked?'var(--ink)':'var(--proto)',stroke:'#fff','stroke-width':3,filter:'url(#soft)'});
      hd.style.cursor='grab'; hd.dataset.role='auxhandle';
      g.appendChild(hd);
      if(locked){
        // lock glow + 🔒 badge on the handle
        const glow=el('circle',{cx:px,cy:py,r:21,fill:'none',stroke:'var(--ink)','stroke-width':3,opacity:.55});
        glow.appendChild(el('animate',{attributeName:'r',values:'18;23;18',dur:'1.2s',repeatCount:'indefinite'}));
        g.appendChild(glow);
        const lk=el('text',{x:px,y:py+1,'text-anchor':'middle','dominant-baseline':'central','font-size':14,fill:'#fff'});
        lk.textContent='🔒'; lk.dataset.role='auxhandle';
        g.appendChild(lk);
        // ⑥ two tappable parts, colors synced with their arc segments.
        // mid of first segment (rayA → aux) and second segment (aux → rayB):
        const span1=norm360(state.auxAngle-q.rayA)||360;   // rayA → aux (CCW)
        const span2=norm360(q.rayB-state.auxAngle)||360;   // aux → rayB (CCW)
        const midA=norm360(q.rayA + span1/2);              // mid of first segment → part 'a'
        const midB=norm360(state.auxAngle + span2/2);      // mid of second segment → part 'b'
        pendingParts.push([cx,cy,midA,86,'a',COL_A]);
        pendingParts.push([cx,cy,midB,86,'b',COL_B]);
      }else{
        // not yet split — show the reflex ? to guide
        const mid=norm360(q.rayA + q.target/2);
        labelAngle(g,cx,cy,mid,66,'?',COL_B,true);
      }
    }
    else if(state.mode==='360'){
      // keep the original reflex ? (the angle being asked) visible on the outer side
      drawAngleArc(g,cx,cy,q.rayA,q.rayB,42,'var(--berry)');
      const reflexMid=norm360(q.rayA + q.target/2);
      labelAngle(g,cx,cy,reflexMid,66,'?','var(--berry)',true);
      // pattern B: highlight inner angle and let child type it (⑦) — drawn on top
      // ⑧ 内がわの角は外がわの reflex「？」(berry/ピンク)と色が近いと区別しにくい
      //    ので、はっきり違う水色系にする。
      drawAngleArc(g,cx,cy,q.rayB,q.rayA,40,'var(--sky-dark)',true);
      const innerMid=norm360(q.rayB+(360-q.target)/2);
      pendingParts.push([cx,cy,innerMid,72,'a','var(--sky-dark)']);
    }
    else{
      // no method chosen yet — show the reflex arc + ? so it's clear which angle is asked
      drawAngleArc(g,cx,cy,q.rayA,q.rayB,42,'var(--berry)');
      const mid=norm360(q.rayA + q.target/2);
      labelAngle(g,cx,cy,mid,66,'?','var(--berry)',true);
    }
  }else{
    drawAngleArc(g,cx,cy,q.rayA,q.rayB,38,'var(--coral)');
    const mid=norm360(q.rayA+q.target/2);
    labelAngle(g,cx,cy,mid,60,'?','var(--coral)',true);
  }
  // ④ 90度ものさし（比較図）: レベル1・2のヒントで、出題の角と「90度ちょうど」を
  //    見くらべられるよう、頂点から はかりたい辺(rayA)に直角の 半透明な
  //    水色のL字(直角マーク付き)を重ねて描く。
  if(state.cmp90 && (q.level===1 || q.level===2)){
    drawNinetyRuler(g,cx,cy,q.rayA);
  }
  vertexDot(g,cx,cy);
}

/* ④ 90度ものさし: 頂点 cx,cy から、基準辺 baseDeg に対して直角(反時計回りに+90°)
   の方向へ水色の辺を引き、直角の四角マークと「90°」ラベルを添える。出題の角が
   90度より大きいか小さいかを目で比べられるようにするためのヒント図。 */
function drawNinetyRuler(g,cx,cy,baseDeg){
  const len=rayLen(220);
  const perp=norm360(baseDeg+90);   // 基準辺から反時計回りに90°
  const SKY='var(--sky-dark)';
  // 基準辺(rayAと同じ向き)を強調
  const [bx,by]=polar(cx,cy,baseDeg,len);
  g.appendChild(el('line',{x1:cx,y1:cy,x2:bx,y2:by,stroke:SKY,'stroke-width':5,
    'stroke-linecap':'round',opacity:.55}));
  // 直角のもう一辺
  const [px,py]=polar(cx,cy,perp,len);
  const arm=el('line',{x1:cx,y1:cy,x2:px,y2:py,stroke:SKY,'stroke-width':5,
    'stroke-linecap':'round','stroke-dasharray':'10 7',opacity:.85});
  arm.appendChild(el('animate',{attributeName:'opacity',values:'.45;.95;.45',dur:'1.4s',repeatCount:'indefinite'}));
  g.appendChild(arm);
  // 直角マーク(小さな四角)
  const s=22;
  const [c1x,c1y]=polar(cx,cy,baseDeg,s);
  const [c2x,c2y]=polar(cx,cy,perp,s);
  const [c3x,c3y]=[c1x+(c2x-cx),c1y+(c2y-cy)];
  g.appendChild(el('path',{d:`M ${c1x.toFixed(1)} ${c1y.toFixed(1)} L ${c3x.toFixed(1)} ${c3y.toFixed(1)} L ${c2x.toFixed(1)} ${c2y.toFixed(1)}`,
    fill:'none',stroke:SKY,'stroke-width':3,opacity:.9}));
  // 「90°」ラベル
  const [tx,ty]=polar(cx,cy,norm360(baseDeg+45),64);
  const t=el('text',{x:tx,y:ty,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Zen Maru Gothic','font-weight':900,'font-size':20,fill:SKY,
    stroke:'#fff','stroke-width':5,'paint-order':'stroke'});
  t.textContent='90°'; g.appendChild(t);
}

function vertexDot(g,cx,cy){
  g.appendChild(el('circle',{cx,cy,r:7,fill:'#fff',stroke:'var(--line)','stroke-width':3}));
  g.appendChild(el('circle',{cx,cy,r:2.5,fill:'var(--line)'}));
}

/* ③ Highlight the angle currently being measured (level 5, loupe on):
   a translucent pink wedge between its two boundary lines + red edge overlays. */
function drawMeasureEmphasis(g,cx,cy){
  const b=measuredBoundaries(); if(!b) return;
  const len=rayLen(235);
  // wedge: vertex → along start edge → sampled arc to end edge → back to vertex
  let span=norm360(b.end-b.start); if(span===0)span=360;
  const r=len;
  const steps=Math.max(2,Math.ceil(span/4));
  let d=`M ${cx.toFixed(2)} ${cy.toFixed(2)} `;
  for(let i=0;i<=steps;i++){
    const a=b.start+span*(i/steps);
    const [x,y]=polar(cx,cy,a,r);
    d+='L '+x.toFixed(2)+' '+y.toFixed(2)+' ';
  }
  d+='Z';
  const wedge=el('path',{d,fill:'var(--hint)',opacity:.28,stroke:'none'});
  g.appendChild(wedge);
  // red edge overlays on the two boundary lines
  const RED='#e23b2e';
  [b.start,b.end].forEach(ang=>{
    const [px,py]=polar(cx,cy,ang,len);
    g.appendChild(el('line',{x1:cx,y1:cy,x2:px,y2:py,stroke:RED,'stroke-width':5,
      'stroke-linecap':'round',opacity:.9}));
  });
}
function drawAngleArc(g,cx,cy,from,to,r,color,red){
  // arc from 'from' to 'to' going CCW (increasing angle)
  let span=norm360(to-from); if(span===0)span=360;
  const steps=Math.max(2,Math.ceil(span/4));
  let d='';
  for(let i=0;i<=steps;i++){
    const a=from+span*(i/steps);
    const [x,y]=polar(cx,cy,a,r);
    d+=(i===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2)+' ';
  }
  const p=el('path',{d,fill:'none',stroke:color,'stroke-width':red?7:4,'stroke-linecap':'round',opacity:red?.55:.9});
  g.appendChild(p);
}
function labelAngle(g,cx,cy,deg,r,txt,color,big){
  const [x,y]=polar(cx,cy,deg,r);
  const t=el('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Zen Maru Gothic','font-weight':900,'font-size':big?30:20,fill:color});
  t.textContent=txt;
  // little white halo
  const t2=el('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Zen Maru Gothic','font-weight':900,'font-size':big?30:20,fill:'none',stroke:'#fff','stroke-width':5,'stroke-linejoin':'round'});
  t2.textContent=txt;
  g.appendChild(t2); g.appendChild(t);
}

/* tappable angle "?" input (level5 ⑥⑦). part = 'a' | 'b'.
   Shows the typed value or "?"; tapping selects it so the keypad types here. */
function labelInput(g,cx,cy,deg,r,part,color){
  const [x,y]=polar(cx,cy,deg,r);
  const val=state.partInputs[part];
  const active=(state.activePart===part);
  const txt = val!=="" ? val+'°' : '?';
  const w = Math.max(46, txt.length*16+22), h=34;
  const grp=el('g',{});
  grp.style.cursor='pointer';
  grp.dataset.role='partlabel'; grp.dataset.part=part;
  const rect=el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:11,
    fill:active?color:'#fff',stroke:color,'stroke-width':active?3:2.5,
    filter:'url(#soft)'});
  grp.appendChild(rect);
  const t=el('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Zen Maru Gothic','font-weight':900,'font-size':20,
    fill:active?'#fff':color});
  t.textContent=txt;
  grp.appendChild(t);
  // a little tap hint when empty & not active
  if(val==="" && !active){
    const hint=el('text',{x,y:y+h/2+12,'text-anchor':'middle','dominant-baseline':'central',
      'font-size':10,'font-weight':700,fill:color});
    hint.textContent='タップ';
    grp.appendChild(hint);
  }
  g.appendChild(grp);
}

/* ④① Decide which number ring the child should read for the hint band, and
   over which angular sweep it should be drawn.

   The protractor's baseline has two ends:
     local 0°   = the right end (rotate-handle end) → reads the OUTER black scale
                  going CCW (up over the top to the left).
     local 180° = the left end                       → reads the INNER red scale.
   A protractor end laid on a "start" boundary reads the angle swept toward the
   "end" boundary on whichever scale increases in that direction.

   This returns the two boundary directions of the angle the child is currently
   measuring (start → end, CCW), so the hint band can be drawn ONLY across that
   span (not the whole 0–180 ring) — pointing right at the numbers to read. */
function measuredBoundaries(){
  const q=state.q;
  if(!q) return null;
  // Levels 1–2: the angle is rayA → rayB.
  if(q.level!==4) return {start:q.rayA, end:q.rayB};
  // Level 4, 360 mode: the inner (small) angle is rayB → rayA.
  if(state.mode==='360') return {start:q.rayB, end:q.rayA};
  // Level 4, aux mode (locked): the angle depends on which "?" part is selected.
  if(state.mode==='aux' && state.auxLocked && state.auxAngle!=null){
    const aux=norm360(state.auxAngle);
    // part 'a' = rayA → aux ; part 'b' = aux → rayB.
    // When the loupe is on, the magnified part (loupePart) takes priority;
    // otherwise fall back to the keypad-selected part. Default to 'a'.
    const part = (state.loupe && state.loupePart) || state.activePart || 'a';
    if(part==='a') return {start:q.rayA, end:aux};
    return {start:aux, end:q.rayB};
  }
  return {start:q.rayA, end:q.rayB};
}

/* Returns true when the OUTER (black) ring is the one to read for the measured
   angle, based on the protractor's current rotation.

   ① 重要: 辺と 0度線が重なっている方の端が「0」になる。
     ・右端（ローカル 0° = p.rot）が辺に合っている → 外側（黒）目盛りが 0 から始まる
     ・左端（ローカル 180° = p.rot+180）が辺に合っている → 内側（赤）目盛りが 0 から始まる
   どちらの端が「いずれかの辺（boundary）」に重なっているかを判定し、
   その端で 0 を読む目盛りを返す。start/end の決め打ちはしない。 */
function whichScale(){
  const q=state.q, p=state.prot;
  if(!q) return true;
  const b=measuredBoundaries(); if(!b) return true;
  const boundaries=[b.start, b.end];
  // 右端(0°)・左端(180°) それぞれが、いずれかの境界線にどれだけ近いか。
  const gapToNearest=(end)=>Math.min(
    ...boundaries.map(bd=>Math.abs(((end-bd+540)%360)-180))
  );
  const gap0  =gapToNearest(p.rot);       // 右端（外側＝黒が 0）
  const gap180=gapToNearest(p.rot+180);   // 左端（内側＝赤が 0）
  // 辺に重なっている（＝より近い）端の目盛りを使う。
  // 右端が辺に合っている → 外側(黒)。左端が辺に合っている → 内側(赤)。
  return gap0<=gap180;
}

/* ---- PROTRACTOR (semicircle, draggable + rotatable) ---- */
const PR=205; // protractor radius in user units (enlarged ~1.35x)
// ② On phones the protractor is shrunk ~20% so the figure's rays can reach the
//    scale ticks (the figure sides were too short relative to a big protractor).
const IS_PHONE = (typeof window!=='undefined') &&
  (window.matchMedia ? window.matchMedia('(max-width: 480px)').matches : (window.innerWidth||999)<=480);
const PROT_SCALE = IS_PHONE ? 0.80 : 1.0;
function protRadius(){ return Math.min(PR*PROT_SCALE, W*0.42*PROT_SCALE, H*0.46*PROT_SCALE); }
// ② Standard ray/side length for the angle figure. On phones we lengthen the
//    sides so they reach (slightly past) the protractor's scale ticks instead
//    of stopping short of them. cap keeps it inside the stage.
function rayLen(cap){
  cap = cap || 235;
  let base = Math.min(W*0.30, cap);
  if(IS_PHONE){
    // ensure the side comfortably overlaps the protractor scale (radius R)
    const reach = protRadius()*1.18;
    base = Math.max(base, reach);
    base = Math.min(base, W*0.46, cap*1.25); // but stay on-screen
  }
  return base;
}

function drawProtractor(){
  const g=layers.prot, p=state.prot, R=protRadius();
  // Colors matched to the reference protractor (分度器画像２):
  //  - body lines / ticks / outer numbers : BLACK
  //  - inner reversed scale + 90 + center : RED
  const INK='#2b2b2b', RED='#e23b2e';
  // The flat plastic edge of a real protractor sits a little BELOW the 0–180
  // scale line. We model that margin: local origin (0,0) = the angle vertex,
  // which sits on the 0–180 scale line; the physical bottom edge is at +EDGE.
  const EDGE=Math.round(R*0.085);   // plastic margin below the scale line
  // group transform: translate to center (vertex), rotate by p.rot (screen deg, CCW). SVG rotate is CW+ so negate.
  const grp=el('g',{transform:`translate(${p.x},${p.y}) rotate(${-p.rot})`});
  grp.dataset.role='prot'; grp.style.cursor=p.vlock?'grab':'move';

  // body: half disc bulging upward (-Y) plus a thin rectangular base strip down
  // to the flat physical edge at +EDGE, with rounded bottom corners.
  const body=el('path',{
    d:`M ${-R} 0 A ${R} ${R} 0 0 1 ${R} 0 L ${R} ${EDGE-4} Q ${R} ${EDGE} ${R-4} ${EDGE} L ${-R+4} ${EDGE} Q ${-R} ${EDGE} ${-R} ${EDGE-4} Z`,
    fill:'url(#protFill)',stroke:INK,'stroke-width':2,opacity:.97,filter:'url(#soft)'});
  grp.appendChild(body);

  // concentric reference arcs (printed black bands of the protractor)
  const ringRs=[R-2, R-20, R-40, R-58];
  ringRs.forEach((rr,idx)=>{
    grp.appendChild(el('path',{d:`M ${-rr} 0 A ${rr} ${rr} 0 0 1 ${rr} 0`,
      fill:'none',stroke:INK,'stroke-width':idx===0?1.4:0.9,opacity:.8}));
  });

  // radial spokes every 10° (between inner hole and the tick band)
  const holeR=R*0.20;
  for(let a=0;a<=180;a+=10){
    const ang=a*D2R;
    const xi=Math.cos(ang)*(holeR), yi=-Math.sin(ang)*(holeR);
    const xo=Math.cos(ang)*(R-40), yo=-Math.sin(ang)*(R-40);
    grp.appendChild(el('line',{x1:xi,y1:yi,x2:xo,y2:yo,stroke:INK,'stroke-width':0.7,opacity:.5}));
  }

  // ticks: 1° small, 5° medium, 10° long — drawn just inside the outer arc.
  // The tick band lives between R and the first inner ring, matching the photo.
  for(let a=0;a<=180;a+=1){
    const ang=a*D2R;
    const x1=Math.cos(ang)*(R-2), y1=-Math.sin(ang)*(R-2);
    let inner=R-8;
    if(a%10===0)inner=R-20; else if(a%5===0)inner=R-14;
    const x2=Math.cos(ang)*inner, y2=-Math.sin(ang)*inner;
    grp.appendChild(el('line',{x1,y1,x2,y2,stroke:INK,'stroke-width':a%10===0?1.4:0.6,opacity:.92}));
  }

  // numbers. Reference layout:
  //   OUTER ring  = BLACK, reads 0(left) → 90(top) → 180(right)
  //   INNER ring  = RED,   reads 180(left) → 90(top) → 0(right)
  //   the top "90" is large and RED.
  const trB=R-31;   // outer (black) number radius
  const trR=R-48;   // inner (red) number radius

  // ④③ HINT: flash a pink band over the ring of numbers the child should read.
  // Levels 1–3 align ray A to local 0° and read ray B on the outer scale.
  // ③ Level 5 also benefits: once the protractor is on the figure (360 mode, or
  // after the auxiliary line is locked) we highlight the ring that the child
  // should read, exactly like the earlier levels.
  // v24: ピンクの帯は「180度より大きい角」レベル(level4)でのみ出す。
  // 新レベル1(鋭角＋鈍角)・レベル2(辺が短い)のヒントは 90度ものさし＋コメント方式に
  // 変更したため、これらでは帯を出さない。level3(直線分割)は分度器を使わない。
  // ⑥ aux モードは「?」が2つあるので、子どもがタップした側だけ帯を出す。
  const auxPartChosen = !!((state.loupe && state.loupePart) || state.activePart);
  const showBand = state.hint && state.q && state.q.level===4 &&
          (state.mode==='360' || (state.mode==='aux' && state.auxLocked && auxPartChosen));
  if(showBand){
    const useOuter = whichScale();       // true → outer black ring, false → inner red ring
    const bandR = useOuter ? trB : trR;  // radius of the number ring to cover
    const bw = 15;                       // band thickness (kept snug to one ring)
    // ① Highlight ONLY the part of the ring the child should read: the arc that
    // spans the measured angle. We work in the protractor's LOCAL frame (grp is
    // rotated by -p.rot), where local angle = screen-angle - p.rot. The reading
    // runs from the baseline end on the START boundary, across the angle, to the
    // END boundary. Local angles map onto the printed scale (0° at right end).
    const b=measuredBoundaries();
    let d;
    if(b){
      // local screen-CCW angles of the two boundaries (0..360 from local right)
      let ls=norm360(b.start - p.rot);
      let le=norm360(b.end   - p.rot);
      // pick the boundary lying on the 0–180 printed semicircle as the sweep ends
      // and draw the arc across the measured span on the upper half.
      // Clamp both onto [0,180] (the visible scale half) and sweep between them.
      const a0=clamp(ls>180?360-ls:ls, 0, 180);
      const a1=clamp(le>180?360-le:le, 0, 180);
      const lo=Math.min(a0,a1), hi=Math.max(a0,a1);
      const steps=Math.max(2,Math.ceil((hi-lo)/3));
      d='';
      for(let i=0;i<=steps;i++){
        const ang=(lo+(hi-lo)*(i/steps))*D2R;
        const x=Math.cos(ang)*bandR, y=-Math.sin(ang)*bandR;
        d+=(i===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2)+' ';
      }
    }else{
      d=`M ${-bandR} 0 A ${bandR} ${bandR} 0 0 1 ${bandR} 0`;
    }
    const band=el('path',{
      d,fill:'none',stroke:'var(--hint)','stroke-width':bw,
      'stroke-linecap':'round',opacity:.5});
    band.appendChild(el('animate',{attributeName:'opacity',
      values:'0;.7;.7;0',dur:'1.1s',repeatCount:'indefinite'}));
    grp.appendChild(band);
  }

  for(let a=0;a<=180;a+=10){
    const ang=a*D2R;
    const isTop=(a===90);
    // OUTER black number (value = a)
    const bx=Math.cos(ang)*trB, by=-Math.sin(ang)*trB;
    const tb=el('text',{x:bx,y:by,'text-anchor':'middle','dominant-baseline':'central',
      'font-family':'Arial, sans-serif',
      'font-size':isTop?(R>150?18:14):(R>150?11:9),
      'font-weight':isTop?900:700, fill:isTop?RED:INK});
    tb.textContent=a; tb.setAttribute('transform',`rotate(${p.rot} ${bx} ${by})`);
    grp.appendChild(tb);
    // INNER red number (value = 180-a). Skip 90 here (the big red 90 already shown above).
    if(!isTop){
      const rx=Math.cos(ang)*trR, ry=-Math.sin(ang)*trR;
      const tr=el('text',{x:rx,y:ry,'text-anchor':'middle','dominant-baseline':'central',
        'font-family':'Arial, sans-serif','font-size':R>150?10:8,'font-weight':700,fill:RED});
      tr.textContent=180-a; tr.setAttribute('transform',`rotate(${p.rot} ${rx} ${ry})`);
      grp.appendChild(tr);
    }
  }

  // inner blank semicircle (the central "window")
  grp.appendChild(el('path',{d:`M ${-holeR} 0 A ${holeR} ${holeR} 0 0 1 ${holeR} 0`,
    fill:'rgba(255,255,255,.55)',stroke:INK,'stroke-width':1.2,opacity:.85}));

  // 0–180 scale line (the prominent baseline that runs through the vertex)
  grp.appendChild(el('line',{x1:-R,y1:0,x2:R,y2:0,stroke:INK,'stroke-width':2.2}));

  // "0 / 180" end labels at both ends: black only (red bottom labels removed)
  const fsEnd=R>150?11:9;
  // left end:  black 0
  endLabel(grp,-R+13,'0',INK,-fsEnd*0.7,fsEnd,p.rot);
  // right end: black 180
  endLabel(grp, R-13,'180',INK,-fsEnd*0.7,fsEnd,p.rot);

  // center mark (the rotation center / vertex — matches the blue circle in the markup).
  // It sits on the 0–180 line at the middle: a small red cross + ring.
  const cm=el('g',{});
  cm.appendChild(el('line',{x1:-14,y1:0,x2:14,y2:0,stroke:RED,'stroke-width':1.6}));
  cm.appendChild(el('line',{x1:0,y1:-10,x2:0,y2:10,stroke:RED,'stroke-width':1.6}));
  cm.appendChild(el('circle',{cx:0,cy:0,r:3,fill:'none',stroke:RED,'stroke-width':1.6}));
  cm.appendChild(el('circle',{cx:0,cy:0,r:1.4,fill:RED}));
  grp.appendChild(cm);

  // rotation handle (when vertex-locked) at right end of baseline
  if(p.vlock){
    // larger, easier-to-grab handle. An invisible wide hit-pad makes the touch
    // target generous so the protractor doesn't accidentally unlock.
    const pad=el('circle',{cx:R-3,cy:0,r:34,fill:'transparent'});
    pad.dataset.role='rotate'; pad.style.cursor='grab'; pad.dataset.noloupe='1';
    grp.appendChild(pad);
    const hub=el('circle',{cx:R-3,cy:0,r:18,fill:'var(--sun)',stroke:'#fff','stroke-width':3.5,filter:'url(#soft)'});
    hub.dataset.role='rotate'; hub.style.cursor='grab'; hub.dataset.noloupe='1';
    grp.appendChild(hub);
    const rot=el('text',{x:R-3,y:1,'text-anchor':'middle','dominant-baseline':'central','font-size':18,'font-weight':900,fill:'#fff'});
    rot.textContent='↻'; rot.dataset.role='rotate'; rot.dataset.noloupe='1';
    rot.setAttribute('transform',`rotate(${p.rot} ${R-3} 0)`);
    grp.appendChild(rot);
  }

  // lock indicators
  if(p.vlock){
    grp.appendChild(el('circle',{cx:0,cy:0,r:14,fill:'none',stroke:'var(--grass-dark)','stroke-width':3,opacity:.8}));
  }
  g.appendChild(grp);
}
// helper: an end-of-baseline number label, kept upright via counter-rotation
function endLabel(grp,xx,txt,fill,dy,fs,rot){
  const t=el('text',{x:xx,y:dy,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Arial, sans-serif','font-size':fs,'font-weight':700,fill});
  t.textContent=txt; t.setAttribute('transform',`rotate(${rot} ${xx} ${dy})`);
  grp.appendChild(t);
}

/* ---- HINT overlay ---- */
function drawHint(){
  if(!state.hint) return;
  const q=state.q, g=layers.hint, cx=q.cx, cy=q.cy;
  if(q.level===3){
    // big half arc over the straight line + "180°"
    const R=rayLen(210);
    drawAngleArc(g,cx,cy,0,180,R,'var(--hint)');
    const [tx,ty]=polar(cx,cy,90,R+8);
    const t=el('text',{x:tx,y:ty,'text-anchor':'middle','font-size':30,'font-weight':900,fill:'var(--hint)',stroke:'#fff','stroke-width':5,'paint-order':'stroke'});
    t.textContent='180°'; g.appendChild(t);
    const pulse=el('animate',{attributeName:'opacity',values:'0;1;1;0.4',dur:'1.6s',repeatCount:'indefinite'});
    t.appendChild(pulse);
    return;
  }
  if(q.level===4){
    const len=rayLen(235);
    if(state.mode==='aux'){
      if(state.auxLocked){
        // ⑥ only guide once a "?" part is tapped (matches the number-band gate).
        const auxPartChosen = !!((state.loupe && state.loupePart) || state.activePart);
        if(!auxPartChosen) return;
        // ③ once locked, the pink number band on the protractor guides the read;
        // just keep a soft glow on the locked straight line.
        const [ex,ey]=polar(cx,cy,state.auxAngle,len+10);
        const glow=el('line',{x1:cx,y1:cy,x2:ex,y2:ey,stroke:'var(--hint)','stroke-width':11,'stroke-linecap':'round',opacity:.4});
        glow.appendChild(el('animate',{attributeName:'opacity',values:'.2;.6;.2',dur:'1.3s',repeatCount:'indefinite'}));
        g.appendChild(glow);
      }else{
        // ⑥ guide: either ray can be extended straight — flash BOTH extensions.
        const extA=norm360(q.rayA+180), extB=norm360(q.rayB+180);
        [extA,extB].forEach(ext=>{
          const [ex,ey]=polar(cx,cy,ext,len+10);
          const glow=el('line',{x1:cx,y1:cy,x2:ex,y2:ey,stroke:'var(--hint)','stroke-width':11,'stroke-linecap':'round',opacity:.4});
          glow.appendChild(el('animate',{attributeName:'opacity',values:'.2;.6;.2',dur:'1.3s',repeatCount:'indefinite'}));
          g.appendChild(glow);
        });
        const [tx,ty]=polar(cx,cy,extA,len*0.55);
        hintTag(g,tx,ty,'まっすぐ 180°');
      }
    }else if(state.mode==='360'){
      // guide: highlight the inner (small) angle to measure, label 360−□
      const innerMid=norm360(q.rayB+(360-q.target)/2);
      drawAngleArc(g,cx,cy,q.rayB,q.rayA,58,'var(--hint)');
      const [tx,ty]=polar(cx,cy,innerMid,86);
      hintTag(g,tx,ty,'360 − □');
    }else{
      // no method chosen yet — nudge to pick one
      const [tx,ty]=polar(cx,cy,norm360(q.rayA+q.target/2),96);
      hintTag(g,tx,ty,'ほうほうを えらぼう');
    }
    return;
  }
  // ── レベル1(鋭角＋鈍角混合)・レベル2(辺が短い) ──
  // v24: ピンクの帯/矢印は出さず、90度ものさし(drawFigureで描画)で 90度と
  // 見くらべさせる。さらに、いま 90度より大きいか小さいかをコメントで伝える。
  //   レベル1の「選択フェーズ」(measurePhase=false): 比較図だけ出す(答えを言い切らない)。
  //   レベル1の「測定フェーズ」/レベル2: 90度より大小のコメントも添える。
  if(q.level===1 || q.level===2){
    const showComment = (q.level===2) || (q.level===1 && state.measurePhase);
    if(showComment){
      const big = q.target>90;
      const msg = big ? '90度より 大きい 角だね' : '90度より 小さい 角だね';
      const [tx,ty]=polar(cx,cy,norm360(q.rayA+q.target/2), rayLen(220)*0.5+40);
      hintTag(g,tx,ty,msg);
    }else{
      // 選択フェーズ: 90度と見くらべてね、と促すだけ
      const [tx,ty]=polar(cx,cy,norm360(q.rayA+45), 120);
      hintTag(g,tx,ty,'90度と くらべてみよう');
    }
    return;
  }
}

/* ① draw a small arrowhead at one end of the pink hint arc, pointing OUTWARD
   (tangent to the arc, away from the measured span). atStart=true → the rayA
   end (sweep increases CCW, so outward = clockwise/tangent-back); atStart=false
   → the rayB end (outward = continue CCW). */
function drawArcEndArrow(g,cx,cy,deg,r,atStart){
  const [px,py]=polar(cx,cy,deg,r);
  // tangent direction along the arc at this point (screen, y-down):
  // arc is parameterised by increasing angle CCW; tangent (CCW) = (sin? ...).
  // outward at the start end = -tangent (CCW) ; at the end = +tangent (CCW).
  const sign = atStart ? +1 : -1;            // rotate the heading off the radial
  const head = norm360(deg + sign*90);        // tangent direction, pointing outward
  const ah=14;                                // arrowhead size
  // tip slightly beyond the arc point, along the tangent
  const [tipx,tipy]=polar(px,py,head,8);
  const left =norm360(head+150), right=norm360(head-150);
  const [lx2,ly2]=polar(tipx,tipy,left,ah);
  const [rx2,ry2]=polar(tipx,tipy,right,ah);
  const tri=el('path',{d:`M ${tipx.toFixed(2)} ${tipy.toFixed(2)} L ${lx2.toFixed(2)} ${ly2.toFixed(2)} L ${rx2.toFixed(2)} ${ry2.toFixed(2)} Z`,
    fill:'var(--hint)',stroke:'none'});
  g.appendChild(tri);
}

/* small pink pill label used by level-5 hints */
function hintTag(g,x,y,txt){
  const w=Math.max(64, txt.length*11+20);
  const tag=el('g',{});
  tag.appendChild(el('rect',{x:x-w/2,y:y-13,width:w,height:24,rx:9,fill:'var(--hint)',filter:'url(#soft)'}));
  const tt=el('text',{x,y:y-1,'text-anchor':'middle','dominant-baseline':'central','font-size':12,'font-weight':900,fill:'#fff'});
  tt.textContent=txt; tag.appendChild(tt);
  const pulse=el('animate',{attributeName:'opacity',values:'.4;1;.4',dur:'1.4s',repeatCount:'indefinite'});
  tag.appendChild(pulse);
  g.appendChild(tag);
}

/* ---- LOUPE ---- */
function drawLoupe(){
  // Magnify the OUTER edge of the protractor where the measured angle's far
  // boundary crosses the tick band and printed numbers — that's exactly the
  // value the child should read. ⑥⑦
  const q=state.q; if(q.level===3){return;}
  const p=state.prot; const R=protRadius();
  let fx,fy;
  // The edge to read = the boundary of the measured angle that is NOT laid on
  // the protractor's 0° baseline. The baseline has two physical ends: the right
  // end (local 0° = p.rot) and the left end (local 180° = p.rot+180). The child
  // lays ONE end on one boundary as the "0° line"; the value is then read off
  // the OTHER boundary. So we magnify whichever boundary sits FURTHER from both
  // baseline ends (i.e. the one the 0° line is not aligned with).
  const b=measuredBoundaries();
  let edge = b ? b.end : q.rayB;
  if(b && p.visible){
    // angular gap of each boundary to the nearest baseline end (right or left)
    const gapTo=(boundary)=>{
      const g0  =Math.abs(((p.rot     - boundary+540)%360)-180); // right end (0°)
      const g180=Math.abs(((p.rot+180 - boundary+540)%360)-180); // left end (180°)
      return Math.min(g0,g180);
    };
    const gs=gapTo(b.start), ge=gapTo(b.end);
    // the boundary closest to a baseline end is the "0° line"; magnify the other.
    edge = (gs<=ge) ? b.end : b.start;
  }else if(q.level===4 && state.mode==='aux' && state.auxLocked && state.auxAngle!=null){
    // protractor not yet placed in aux mode: fall back to the non-auxiliary edge
    const part = (state.loupe && state.loupePart) || state.activePart || 'a';
    edge = (part==='a') ? q.rayA : q.rayB;
  }
  if(p.visible){
    [fx,fy]=polar(q.cx,q.cy,edge, R-26);                 // scale band of the protractor
  }else{
    [fx,fy]=polar(q.cx,q.cy,edge, rayLen(235)-20);
  }
  const g=layers.loupe;
  const lr=Math.round(Math.min(112, W*0.20, H*0.26)); // bigger lens (was 72)
  // ④ Position the lens on the SAME side as the scale point being magnified:
  // if the reading edge is on the right half of the protractor, show the lens to
  // the right; if on the left half, show it to the left. Centre of reference is
  // the protractor vertex (p.x) when visible, else the figure vertex (q.cx).
  let lx, ly;
  const centerX = p.visible ? p.x : q.cx;
  const onRight = fx >= centerX;            // which side the magnified point sits
  if(p.visible){
    lx = onRight ? (p.x + R + lr + 18)      // clear of the right edge
                 : (p.x - R - lr - 18);     // clear of the left edge
    ly = clamp(p.y - R*0.45, lr+14, H-lr-14);
  }else{
    lx = onRight ? clamp(q.cx + 170, lr+14, W-lr-14)
                 : clamp(q.cx - 170, lr+14, W-lr-14);
    ly = clamp(q.cy, lr+14, H-lr-14);
  }
  // keep on-screen
  if(lx > W-lr-8) lx = W-lr-8;
  if(lx < lr+8) lx = lr+8;
  ly = clamp(ly, lr+8, H-lr-8);
  const k=3.0; // zoom (was 2.6) — show the fine 1° ticks clearly
  // clip
  const clip=el('clipPath',{id:'loupeClip'});
  clip.appendChild(el('circle',{cx:lx,cy:ly,r:lr}));
  g.appendChild(clip);
  const inner=el('g',{'clip-path':'url(#loupeClip)'});
  // background
  inner.appendChild(el('circle',{cx:lx,cy:ly,r:lr,fill:'#fff'}));
  // cloned figure+protractor scaled around focus
  const tg=el('g',{transform:`translate(${lx},${ly}) scale(${k}) translate(${-fx},${-fy})`});
  tg.appendChild(layers.fig.cloneNode(true));
  if(p.visible){
    // ② 拡大図には回転ハンドル（スピンボタン）を出さない。拡大すると目もりを
    //    覆い隠してしまうため、クローンから data-noloupe 要素を取り除く。
    const protClone=layers.prot.cloneNode(true);
    protClone.querySelectorAll('[data-noloupe]').forEach(n=>n.remove());
    tg.appendChild(protClone);
  }
  inner.appendChild(tg);
  g.appendChild(inner);
  // ring
  g.appendChild(el('circle',{cx:lx,cy:ly,r:lr,fill:'none',stroke:'var(--sun-dark)','stroke-width':7}));
  g.appendChild(el('circle',{cx:lx,cy:ly,r:lr,fill:'none',stroke:'#fff','stroke-width':2.5}));
  // handle
  const [hx,hy]=[lx-lr*0.72,ly+lr*0.72];
  g.appendChild(el('line',{x1:hx,y1:hy,x2:hx-26,y2:hy+26,stroke:'var(--sun-dark)','stroke-width':11,'stroke-linecap':'round'}));
}

/* ================= INTERACTION (drag / rotate / snap) ================= */
function svgPoint(evt){
  const t=(evt.touches&&evt.touches[0])||(evt.changedTouches&&evt.changedTouches[0])||evt;
  // Because the stage uses preserveAspectRatio="none" with a viewBox kept in
  // sync with the element's displayed size, screen-px map to user-units by a
  // simple per-axis scale. We compute this directly from the bounding rect
  // rather than via getScreenCTM(): reading the CTM right after a viewBox
  // mutation can return a stale matrix on some mobile engines, which made the
  // FIRST tap land at the wrong coordinates (so it appeared to "do nothing").
  const r=stage.getBoundingClientRect();
  const vbW = (W>0 ? W : r.width);
  const vbH = (H>0 ? H : r.height);
  const sx = r.width  ? (vbW / r.width)  : 1;
  const sy = r.height ? (vbH / r.height) : 1;
  return [ (t.clientX - r.left) * sx, (t.clientY - r.top) * sy ];
}
const SNAP_V=34, SNAP_E=8; // snap thresholds

// The set of baseline directions the protractor's 0–180 line may lock onto.
// The baseline is symmetric, so for each side we allow the ray direction OR its
// 180° opposite (either physical end can lie on a side).
function snapTargets(){
  const q=state.q; if(!q) return [];
  return [q.rayA, norm360(q.rayA+180), q.rayB, norm360(q.rayB+180)];
}
// ② Pick the CLOSEST snap target to the given rotation (not the last match in
//    array order). Near 180° the four targets collapse into two near-coincident
//    pairs; last-match-wins could pull rot to the wrong side or refuse a clean
//    lock. Returns {rot, lock} where lock is true when within SNAP_E.
function nearestSnap(rot){
  let best=null, bestDiff=Infinity;
  for(const ray of snapTargets()){
    const diff=Math.abs(((rot-ray+540)%360)-180);
    if(diff<bestDiff){ bestDiff=diff; best=ray; }
  }
  if(best!=null && bestDiff<SNAP_E) return {rot:best, lock:true};
  return {rot, lock:false};
}
// ① Recompute elock from the CURRENT rotation whenever the protractor is on the
//    vertex. This makes elock a derived fact (0° line aligned to a side) instead
//    of something only set during an active rotate drag — so a protractor that
//    is dropped already aligned, or nudged by the body, is still considered
//    "aligned" and the 💡 hint button stays enabled.
function recomputeElock(){
  const p=state.prot;
  if(!(p.visible && p.vlock)){ p.elock=false; return; }
  const s=nearestSnap(p.rot);
  if(s.lock){ p.rot=s.rot; p.elock=true; }
  else { p.elock=false; }
}
// ① Touch-friendly hit radii (in px). Fingers are imprecise and the SVG
//    elements themselves are thin, so on touch devices we make every grab
//    target noticeably larger than on mouse (where the cursor is precise).
const IS_TOUCH = (typeof window!=='undefined') &&
  (('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0);
const HIT_ROTATE = IS_TOUCH ? 64 : 46;   // grab radius around the ↻ rotate handle
const HIT_AUX    = IS_TOUCH ? 62 : 44;   // grab radius around the auxiliary-line handle
const HIT_BODY   = IS_TOUCH ? 30 : 16;   // extra slack around the protractor body edge

// ② Is the point on/near the angle figure (vertex or its rays)? Used so that a
// tap on the figure does NOT dismiss the magnifier — only taps on truly empty
// space do. Generous so the thin rays are easy to "hit".
function nearFigure(mx,my){
  if(!state.q) return false;
  const q=state.q;
  const FIG_HIT=30;
  if(dist(mx,my,q.cx,q.cy)<60) return true;     // near the vertex
  const len=rayLen(260);
  const rays = q.level===3
    ? [0,180,q.divider]
    : [q.rayA,q.rayB];
  for(const a of rays){
    if(distToSegment(mx,my,q.cx,q.cy, ...polar(q.cx,q.cy,a,len)) < FIG_HIT) return true;
  }
  return false;
}
// distance from point (px,py) to segment (x1,y1)-(x2,y2)
function distToSegment(px,py,x1,y1,x2,y2){
  const vx=x2-x1, vy=y2-y1;
  const wx=px-x1, wy=py-y1;
  const len2=vx*vx+vy*vy || 1;
  let t=(wx*vx+wy*vy)/len2; t=Math.max(0,Math.min(1,t));
  const cx=x1+t*vx, cy=y1+t*vy;
  return Math.hypot(px-cx,py-cy);
}

// Returns the role under a screen point using GEOMETRY, not e.target.
// e.target is unreliable on touch (it can resolve to an overlapping layer
// such as the "?" part labels or hint overlay drawn above the protractor),
// which was causing taps on the protractor / rotate handle to be missed and
// taps away from the handle to rotate. Geometry-based hit testing fixes both.
function hitRole(mx,my){
  const p=state.prot, R=protRadius();
  // 1) auxiliary handle (level 5 aux mode) and 2) rotate handle can sit close
  //    together. Compute the distance to EACH, then pick whichever the finger is
  //    actually closer to — otherwise giving aux blanket priority would let a tap
  //    on the rotate handle get stolen by aux whenever they overlap.
  let auxD=Infinity, rotD=Infinity;
  if(state.mode==='aux' && state.auxAngle!=null){
    const fullLen=rayLen(235);
    const [ax,ay]=polar(state.q.cx,state.q.cy,state.auxAngle,fullLen+10);
    auxD=dist(mx,my,ax,ay);
  }
  if(state.prot.visible && p.vlock){
    const [hx,hy]=polar(p.x,p.y,p.rot,R-3);
    rotD=dist(mx,my,hx,hy);
  }
  const auxHit = auxD<HIT_AUX;
  const rotHit = rotD<HIT_ROTATE;
  if(auxHit || rotHit){
    if(auxHit && rotHit) return (auxD<=rotD) ? 'aux' : 'rotate';
    return auxHit ? 'aux' : 'rotate';
  }
  // 3) protractor body — only the actual upper semicircle (+ a small base
  //    strip), NOT the empty lower half. This matches what the child sees.
  if(state.prot.visible){
    const d=dist(mx,my,p.x,p.y);
    if(d<R+HIT_BODY){
      // angle of the point relative to the protractor's own (rotated) frame.
      // local angle 0..180 = the visible half-disc; allow a little below the
      // baseline to cover the flat base strip (more slack on touch).
      const local=norm360(angleOf(p.x,p.y,mx,my)-p.rot);
      const baseStrip = IS_TOUCH ? 315 : 335;
      const onDisc = (local<=180) || (local>=baseStrip);
      if(onDisc) return 'move';
    }
  }
  return null;
}

function syncViewBox(){
  // keep viewBox == current displayed px size so user-units == screen px.
  // Cheap; call right before reading a touch so a pending (debounced) resize
  // can never leave us mapping into a stale coordinate system.
  const r=stage.getBoundingClientRect();
  if(Math.abs(r.width-W)>0.5 || Math.abs(r.height-H)>0.5){
    W=r.width;H=r.height;
    stage.setAttribute('viewBox',`0 0 ${W} ${H}`);
  }
}

function pointerDown(e){
  syncViewBox();
  const [mx,my]=svgPoint(e);
  // ⑥⑦ level5: tap a "?" angle label. These live ABOVE the protractor, so we
  // still detect them via e.target (a deliberate tap, not a drag).
  const tgtRole=e.target.dataset?.role || e.target.parentNode?.dataset?.role;
  if(tgtRole==='partlabel'){
    const part=e.target.dataset?.part || e.target.parentNode?.dataset?.part;
    state.activePart = (state.activePart===part)? null : part;
    if(state.level===4 && state.loupe && state.activePart===part){
      state.loupePart=part;
      state.loupeFocus=null;
    }
    render();
    e.preventDefault();
    return;
  }
  if(!state.prot.visible && state.mode!=='aux') {return;}

  // Everything else is decided by GEOMETRY, so finger imprecision and
  // overlapping SVG layers can't steal the touch.
  const role=hitRole(mx,my);
  // ② Tapping empty space (no protractor, no figure, no "?" part) hides the
  // magnifier. A part label was already handled above; a tap on the figure
  // (near the vertex / rays) is treated as "on the figure" and does NOT dismiss.
  if((state.loupe||state.hint) && !role && !nearFigure(mx,my)){
    if(state.loupe){
      state.loupe=false; state.loupeFocus=null; state.loupePart=null;
      document.getElementById('loupeBtn').classList.remove('on');
    }
    if(state.hint){
      state.hint=false;
      document.getElementById('hintBtn').classList.remove('chosen');
    }
    render();
    e.preventDefault();
    return;
  }
  if(role==='aux'){
    state.drag={type:'aux'}; e.preventDefault(); return;
  }
  if(role==='rotate'){
    state.drag={type:'rotate'}; e.preventDefault(); return;
  }
  if(role==='move'){
    const p=state.prot;
    state.drag={type:'move',dx:mx-p.x,dy:my-p.y};
    e.preventDefault();
    return;
  }
}
function pointerMove(e){
  if(!state.drag) return;
  e.preventDefault();
  const [mx,my]=svgPoint(e), q=state.q, p=state.prot;
  if(state.drag.type==='move'){
    p.x=mx-state.drag.dx; p.y=my-state.drag.dy;
    p.vlock=false; p.elock=false;
    // snap center to vertex
    if(dist(p.x,p.y,q.cx,q.cy)<SNAP_V){
      p.x=q.cx; p.y=q.cy; p.vlock=true; pulseLock(q.cx,q.cy); haptic();
    }
    // ① If the protractor lands on the vertex already aligned to a side, treat
    //    it as aligned (elock) so 💡 hint becomes usable without nudging rotate.
    recomputeElock();
    render();
  }else if(state.drag.type==='rotate'){
    // ③ レベル6: 分度器を回転させたら、読みたい角の「？」タップも
    //    ヒントも解除する（合わせ直したら選び直す運用にして誤読を防ぐ）。
    if(state.level===4){
      if(state.activePart){ state.activePart=null; }
      if(state.hint){
        state.hint=false;
        document.getElementById('hintBtn').classList.remove('chosen');
      }
      if(state.loupe && state.loupePart){ state.loupePart=null; }
    }
    // rotate so baseline aligns toward pointer
    let a=angleOf(p.x,p.y,mx,my);
    p.rot=a;
    p.elock=false;
    // ② Lock to the CLOSEST baseline direction (either side, either end). Using
    //    the nearest target — instead of the last one that happened to match —
    //    means that near 180° (where rayA, rayB and their opposites bunch
    //    together) aligning the right 0° line to the right side locks just as
    //    reliably as the left side, even after the left side was locked first.
    const s=nearestSnap(p.rot);
    if(s.lock){ p.rot=s.rot; p.elock=true; }
    render();
  }else if(state.drag.type==='aux'){
    let a=angleOf(q.cx,q.cy,mx,my);
    // ⑥ Two valid straight extensions: along ray A or along ray B.
    // Snap to whichever the child is dragging closest to.
    const targetA=norm360(q.rayA+180);   // straight 180° extension of ray A
    const targetB=norm360(q.rayB+180);   // straight 180° extension of ray B
    const diffA=Math.abs(((a-targetA+540)%360)-180);
    const diffB=Math.abs(((a-targetB+540)%360)-180);
    const useA = diffA<=diffB;
    const targetLine = useA ? targetA : targetB;
    const diff = useA ? diffA : diffB;
    const wasLocked=state.auxLocked;
    // hysteresis: easy to grab (within SNAP_AUX), but stays locked until pulled
    // well away (RELEASE_AUX) so it doesn't jitter off the straight line.
    const SNAP_AUX=9, RELEASE_AUX=16;
    if(diff < (wasLocked?RELEASE_AUX:SNAP_AUX)){
      state.auxAngle=targetLine; state.auxLocked=true;
      state.auxBase = useA ? 'A' : 'B';
    }else{
      state.auxAngle=a; state.auxLocked=false;
    }
    // run the "just locked" side-effects only on the transition into lock
    if(state.auxLocked && !wasLocked){
      haptic();
      pulseLock(q.cx,q.cy);
      showMemo();
      // ⑤ Bring the protractor in at a spot that does NOT overlap the figure,
      // UNLOCKED, so the child has to drag & drop it onto the vertex (just like
      // level 1) before measuring the remaining (180 + □) part.
      const p2=state.prot, R=protRadius();
      p2.visible=true; p2.vlock=false; p2.elock=false; p2.rot=0;
      // park it in a clear corner away from the vertex/figure
      p2.x=clamp(W-R-20, R+20, W-R-20);
      p2.y=clamp(R+30, R+20, H-30);
      if(dist(p2.x,p2.y,q.cx,q.cy) < R+60){ p2.y=clamp(H-40, R+20, H-30); }
    }
    render();
  }
}
function pointerUp(){ state.drag=null; }

// ── Event wiring ────────────────────────────────────────────────────────────
// The protractor and its handles are drawn as SVG children, and on touch the
// event target can resolve to an overlapping layer (or be swallowed entirely),
// which made the INITIAL tap on the protractor / rotate-arrow do nothing.
// To make the start tap rock-solid we:
//   • bind the "down" listener to the STAGE CONTAINER (stage-wrap) so a touch
//     anywhere over the drawing reaches us, never blocked by a child SVG node;
//   • prefer Pointer Events (one unified, reliable path for mouse + touch on
//     modern mobile), and only fall back to touch/mouse on older engines;
//   • route move/up through the window so a drag keeps tracking even if the
//     finger slides outside the stage.
const downTarget = document.getElementById('stage-wrap') || stage;

if(window.PointerEvent){
  // Pointer Events: the modern, reliable unified path.
  downTarget.addEventListener('pointerdown', e=>{
    // ignore secondary touches while already dragging
    if(state.drag && e.isPrimary===false) return;
    pointerDown(e);
  }, {passive:false});
  window.addEventListener('pointermove', pointerMove, {passive:false});
  window.addEventListener('pointerup',   pointerUp);
  window.addEventListener('pointercancel', pointerUp);
}else{
  // Fallback for engines without Pointer Events.
  downTarget.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup',   pointerUp);
  downTarget.addEventListener('touchstart', pointerDown, {passive:false});
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend',  pointerUp);
  window.addEventListener('touchcancel', pointerUp);
}

function pulseLock(x,y){
  const c=el('circle',{cx:x,cy:y,r:10,fill:'none',stroke:'var(--grass-dark)','stroke-width':4});
  c.appendChild(el('animate',{attributeName:'r',values:'10;40',dur:'.5s',fill:'freeze'}));
  c.appendChild(el('animate',{attributeName:'opacity',values:'.9;0',dur:'.5s',fill:'freeze'}));
  layers.hint.appendChild(c);
  setTimeout(()=>c.remove(),520);
}
function haptic(){ if(navigator.vibrate) navigator.vibrate(18); }

/* ================= ANSWER / KEYPAD ================= */
const ansDisplay=document.getElementById('ansDisplay');
/* ⑥⑦ derive the final answer (and memo) from the tapped angle parts */
function syncLevel5Answer(){
  if(state.level!==4) return;
  if(state.mode==='aux'){
    const a=parseInt(state.partInputs.a,10);
    const b=parseInt(state.partInputs.b,10);
    if(!isNaN(a) && !isNaN(b)){
      const sum=a+b;
      state.answer=String(sum);
      setMemo(`${a} + ${b} = <span class="eq-result">${sum}°</span>`, true);
    }else if(!isNaN(a) || !isNaN(b)){
      // 片方だけ入っているときも式の形を見せる
      const av = isNaN(a)?'？':a, bv = isNaN(b)?'？':b;
      state.answer="";
      setMemo(`${av} + ${bv} = <span class="eq-result">？</span>`, false);
    }else{
      state.answer=""; setMemo('');
    }
  }else if(state.mode==='360'){
    const a=parseInt(state.partInputs.a,10);
    if(!isNaN(a)){
      const diff=360-a;
      state.answer=String(diff);
      setMemo(`360 − ${a} = <span class="eq-result">${diff}°</span>`, true);
    }else{
      state.answer=""; setMemo('');
    }
  }
  renderAnswer();
}

function renderAnswer(){
  if(state.answer===""){ ansDisplay.innerHTML='<span class="ph">?</span><span class="cursor"></span>'; return; }
  ansDisplay.innerHTML=`${state.answer}<span class="deg">°</span><span class="cursor"></span>`;
}
document.getElementById('keypad').addEventListener('click',e=>{
  const k=e.target.dataset?.k; if(!k) return;
  // ⑥⑦ if a level5 "?" part is selected, type into it instead of the main answer
  if(state.level===4 && state.activePart){
    const part=state.activePart;
    let v=state.partInputs[part];
    if(k==='C') v="";
    else if(k==='DEL') v=v.slice(0,-1);
    else { if(v.length<3) v+=k; }
    v=v.replace(/^0+(?=\d)/,'');
    state.partInputs[part]=v;
    syncLevel5Answer();
    render();
    return;
  }
